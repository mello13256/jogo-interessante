const Game = {
  /* ---------- início ---------- */
  newGame(name) {
    Engine.abort();
    state = newState(name);
    UI.logLines = [];
    UI.sophieUnmasked = false;
    UI.bgId = null;
    UI.screen('game');
    this.resume();
  },
  load(st) {
    Engine.abort();
    UI.closeModal();
    state = st;
    UI.logLines = [];
    UI.sophieUnmasked = false;
    UI.bgId = null;
    $('#charLayer').innerHTML = '';
    UI.screen('game');
    UI.toast('Jogo carregado: ' + slotLabel(st), 'info');
    this.resume();
  },
  resume() {
    UI.refreshHud();
    if (state.phase === 'day') { this.showDay(); return; }
    if (state.day >= GALA_NIGHT) { this.startGala(); return; }
    UI.setBg(state.loc);
    if (!state.introDone) {
      state.loc = 'rececao';
      Engine.start(SC_INTRO, () => { state.nightIntro = state.day; this.afterAction(); });
      return;
    }
    if (state.nightIntro !== state.day && NIGHT_INTROS[state.day]) {
      state.nightIntro = state.day;
      Engine.start([BG(state.loc), HIDE, ...NIGHT_INTROS[state.day]], () => this.afterAction());
      return;
    }
    this.afterAction();
  },

  /* ---------- cenas e tempo ---------- */
  runScene(nodes, cost, after) {
    Engine.start(nodes, () => {
      if (after) after();
      state.time += cost;
      this.afterAction();
    });
  },
  checkMissed(endOfNight) {
    for (const c of CHAR_IDS) {
      const inv = state.invites[c];
      if (!inv) continue;
      if (inv.day < state.day || (inv.day === state.day && (endOfNight || state.time >= inv.to))) {
        delete state.invites[c];
        state.flags[c + '_missed' + inv.n] = true;
        UI.toast(`Faltaste ao encontro com a ${CHARS[c].name}.`, 'bad');
        addAff(c, -10);
      }
    }
  },
  afterAction() {
    UI.refreshHud();
    this.checkMissed(false);
    if (state.time >= NIGHT_END) { this.endNight(); return; }
    if (state.day === 4 && state.time >= 1440 && !state.flags.blackout_done) {
      UI.toast('As luzes tremem...', 'info');
      this.runScene(SC_BLACKOUT, COST.blackout);
      return;
    }
    this.renderHub();
  },

  /* ---------- hub ---------- */
  renderHub() {
    UI.setBg(state.loc);
    UI.refreshHud();
    $('#dayPanel').classList.add('hidden');
    const hub = $('#hub');
    hub.innerHTML = '';
    hub.classList.remove('hidden');
    $('#game').classList.add('mode-hub');

    const here = charsAt(state, state.loc);
    if (here.length) {
      const c = here[0];
      const mood = (c === 'luna' && state.flags.luna_closed) ? 'sad' : state.aff[c] >= 60 ? 'flirty' : state.aff[c] >= 25 ? 'smile' : 'neutral';
      UI.showChar(c, mood);
      UI.setUnmasked(false);
    } else UI.hideChar();

    // Painel do local
    const p = el('div', 'panel');
    p.appendChild(el('h3', null, 'Estás em'));
    p.appendChild(el('h2', null, LOCS[state.loc].name));
    p.appendChild(el('p', null, LOCS[state.loc].desc));
    const pres = el('div', 'presence');
    if (here.length) {
      for (const c of here) {
        const t = el('span', 'tag');
        const d = el('span', 'dot'); d.style.background = CHARS[c].color;
        t.append(d, document.createTextNode(CHARS[c].name + ' · ' + affLevel(state.aff[c])));
        pres.appendChild(t);
      }
    } else {
      pres.appendChild(el('span', 'tag', 'Não está aqui ninguém de especial neste momento.'));
    }
    p.appendChild(pres);
    const hint = { bar: 'victoria', terraco: 'luna', rececao: 'sophie' }[state.loc];
    if (hint && !here.includes(hint)) p.appendChild(el('p', null, CHARS[hint].where));

    const acts = el('div', 'actions');
    for (const c of here) this.charActions(c, acts);
    this.placeActions(acts);
    p.appendChild(acts);
    hub.appendChild(p);

    // Mapa
    const mp = el('div', 'panel');
    mp.appendChild(el('h3', null, `Ir para · ${COST.travel} min`));
    const grid = el('div', 'map');
    for (const id of MAP_ORDER) {
      if (!locUnlocked(state, id)) continue;
      const b = el('button', 'action');
      const isHere = id === state.loc;
      if (isHere) b.classList.add('here');
      b.appendChild(el('span', 'label', LOCS[id].name));
      const who = charsAt(state, id);
      const ce = canEnter(state, id);
      let sub = isHere ? 'Estás aqui' : (!ce.ok ? ce.why : (who.length ? who.map(c => CHARS[c].name).join(', ') : '—'));
      b.appendChild(el('span', 'who', sub));
      b.disabled = isHere || !ce.ok;
      if (!b.disabled) b.addEventListener('click', () => this.travel(id));
      grid.appendChild(b);
    }
    mp.appendChild(grid);
    hub.appendChild(mp);
  },
  actionButton(label, meta, why, onClick, special) {
    const b = el('button', 'action' + (special ? ' special' : ''));
    const left = el('span');
    left.appendChild(el('span', 'label', label));
    if (why) left.appendChild(el('span', 'why', why));
    b.appendChild(left);
    if (meta) b.appendChild(el('span', 'meta', meta));
    if (onClick) b.addEventListener('click', onClick); else b.disabled = true;
    return b;
  },
  charActions(c, box) {
    const name = CHARS[c].name;
    const closed = c === 'luna' && state.flags.luna_closed;
    // encontro marcado
    const inv = state.invites[c];
    if (inv && inv.loc === state.loc && inv.day === state.day) {
      if (state.time >= inv.from && state.time < inv.to) {
        box.appendChild(this.actionButton(`Encontro com a ${name}`, COST.special + ' min', 'O momento que combinaram.', () => this.attend(c), true));
      } else if (state.time < inv.from) {
        box.appendChild(this.actionButton(`Encontro com a ${name}`, '', `Marcado para as ${fmtTime(inv.from)}.`, null));
      }
    }
    // conversar
    if (closed) {
      box.appendChild(this.actionButton(`Conversar com a ${name}`, '', 'A Luna não te dirige a palavra.', null));
    } else if (state.talked[c] === state.day) {
      box.appendChild(this.actionButton(`Conversar com a ${name}`, '', 'Já conversaram esta noite.', null));
    } else {
      const confront = c === 'luna' && state.flags.luna_betrayed && !state.flags.luna_confronted;
      const ch = nextChapter(state, c);
      const story = confront || !!ch;
      box.appendChild(this.actionButton(`Conversar com a ${name}`, (story ? COST.story : COST.small) + ' min',
        confront ? 'Ela parece estar à tua espera. E não parece contente.' : story ? 'Algo de novo pode acontecer entre vocês.' : 'Uma conversa descontraída.',
        () => this.talk(c), story));
    }
    // presente
    const hasItems = ITEM_IDS.some(i => state.inv[i] > 0);
    let why = null;
    if (closed) why = 'Ela não aceita nada vindo de ti.';
    else if (state.gifted[c] === state.day) why = 'Já lhe ofereceste algo esta noite.';
    else if (!hasItems) why = 'Não tens presentes. A Boutique Noir vende alguns.';
    box.appendChild(this.actionButton(`Oferecer um presente à ${name}`, why ? '' : COST.gift + ' min', why, why ? null : () => this.openInventory(c)));
  },
  placeActions(box) {
    const id = state.loc;
    box.appendChild(this.actionButton('Esperar', COST.wait + ' min', 'Deixar o tempo passar aqui.', () => {
      state.time += COST.wait;
      this.afterAction();
    }));
    if (id === 'rececao') {
      box.appendChild(this.actionButton('Atender hóspedes', COST.work + ' min', 'Gorjetas entre 8 € e 18 €.', () => this.work()));
    } else if (id === 'boutique') {
      box.appendChild(this.actionButton('Ver a montra', '', 'Comprar presentes.', () => this.openShop()));
    } else if (id === 'funcionarios') {
      box.appendChild(this.actionButton('Gravar o jogo', '', 'Escolhe um espaço de gravação.', () => Menus.saveMenu()));
      box.appendChild(this.actionButton('Terminar o turno mais cedo', '', 'Saltar para o fim da noite.', () => {
        UI.confirm('Terminar o turno?', 'O resto da noite passa sem ti. Encontros marcados para esta noite serão perdidos.', 'Terminar turno', () => {
          state.time = Math.max(state.time, NIGHT_END);
          this.afterAction();
        });
      }));
    }
  },

  /* ---------- ações ---------- */
  travel(id) {
    const ce = canEnter(state, id);
    if (!ce.ok) { UI.toast(ce.why, 'bad'); return; }
    state.loc = id;
    state.time += COST.travel;
    this.afterAction();
  },
  talk(c) {
    if (state.talked[c] === state.day) return;
    if (c === 'luna' && state.flags.luna_closed) return;
    state.talked[c] = state.day;
    if (c === 'luna' && state.flags.luna_betrayed && !state.flags.luna_confronted) {
      state.flags.luna_confronted = true;
      this.runScene(LUNA.confront, COST.story);
      return;
    }
    const ch = nextChapter(state, c);
    if (ch) {
      if (ch.invite) this.runScene(CHAPTER_SCENES[c]['inv' + ch.n], COST.story);
      else this.runScene(CHAPTER_SCENES[c][ch.n], COST.story, () => { state.chap[c] = ch.n; });
      return;
    }
    this.runScene(this.smallTalk(c), COST.small);
  },
  smallTalk(c) {
    const pool = SMALL_TALK[c].map((x, i) => ({ i, nodes: Array.isArray(x) ? x : x.nodes, min: Array.isArray(x) ? 0 : x.min }))
      .filter(x => state.chap[c] >= x.min);
    const options = pool.length > 1 ? pool.filter(x => x.i !== state.lastSmall[c]) : pool;
    const sel = pick(options);
    state.lastSmall[c] = sel.i;
    const nodes = [...sel.nodes];
    const inv = state.invites[c];
    if (inv) {
      nodes.push(SAY[c]('smile', `Não te esqueças: ${LOCS[inv.loc].name}, entre as ${fmtTime(inv.from)} e as ${fmtTime(inv.to)}.`));
    } else {
      const n = state.chap[c] + 1;
      const d = CHAPTERS[c][n];
      if (d && state.day >= d.day && state.aff[c] < d.aff && !state.flags[c + '_declined']) {
        nodes.push(N('Sentes que ainda há alguma distância entre vocês. Talvez um gesto — ou um presente bem escolhido — ajude.'));
      } else if (d && state.day < d.day) {
        nodes.push(N('Há qualquer coisa por dizer entre vocês. Talvez numa próxima noite.'));
      }
    }
    nodes.push(FX(() => addAff(c, 3)));
    return nodes;
  },
  attend(c) {
    const inv = state.invites[c];
    if (!inv || inv.loc !== state.loc || !inviteActive(state, c)) return;
    this.runScene(CHAPTER_SCENES[c][inv.n], COST.special, () => {
      state.chap[c] = inv.n;
      delete state.invites[c];
    });
  },
  giveGift(c, item) {
    if (!state.inv[item] || state.gifted[c] === state.day) return;
    UI.closeModal();
    state.inv[item] -= 1;
    if (state.inv[item] <= 0) delete state.inv[item];
    state.gifted[c] = state.day;
    const g = giftScene(c, item);
    state.known[c][item] = g.reaction;
    this.runScene([...g.nodes, FX(() => addAff(c, GIFT_VALUE[g.reaction]))], COST.gift);
  },
  work() {
    const tip = 8 + Math.floor(Math.random() * 11);
    this.runScene([HIDE, N(pick(WORK_LINES)), N(`Ganhas ${tip} € em gorjetas.`), FX(s => { s.tipsTonight += tip; addMoney(tip); })], COST.work);
  },

  /* ---------- fim da noite e dia ---------- */
  endNight() {
    Engine.abort();
    this.checkMissed(true);
    state.money += SALARY;
    state.lastNight = { day: state.day, salary: SALARY, tips: state.tipsTonight };
    state.tipsTonight = 0;
    state.phase = 'day';
    state.time = NIGHT_END;
    if (writeSlot('auto')) UI.toast('Gravação automática concluída.', 'info');
    this.showDay();
  },
  showDay() {
    UI.leaveDialogue();
    UI.hideChar();
    $('#hub').classList.add('hidden');
    $('#game').classList.remove('mode-hub');
    UI.setBg('dia');
    UI.refreshHud();
    const panelWrap = $('#dayPanel');
    panelWrap.innerHTML = '';
    panelWrap.classList.remove('hidden');
    const p = el('div', 'panel');
    p.appendChild(el('h3', null, 'Amanhecer'));
    p.appendChild(el('h2', null, `Fim da Noite ${state.day}`));
    p.appendChild(el('p', null, 'O sol nasce por cima dos telhados. Penduras o casaco do uniforme e sais para uma cidade que está só a acordar.'));
    const sum = el('div', 'summary');
    const cell = (label, val) => { const d = el('div', 'cell'); d.appendChild(el('b', null, val)); d.appendChild(document.createTextNode(label)); return d; };
    const ln = state.lastNight || { salary: SALARY, tips: 0 };
    sum.append(cell('Salário', '+' + ln.salary + ' €'), cell('Gorjetas da noite', ln.tips + ' €'), cell('Dinheiro total', state.money + ' €'));
    for (const c of CHAR_IDS) sum.appendChild(cell(CHARS[c].name + ' · ' + affLevel(state.aff[c]), '♥ ' + state.aff[c]));
    p.appendChild(sum);

    const acts = el('div', 'actions');
    if (state.day >= LAST_FREE_NIGHT) {
      p.appendChild(el('h3', null, 'Amanhã é a Gala de Veludo'));
      p.appendChild(el('p', null, 'É a última noite. O que vais vestir?'));
      const can = state.money >= 50;
      acts.appendChild(this.actionButton('Alugar um smoking elegante', '50 €', can ? 'Causa boa impressão a quem já te conhece.' : 'Não tens dinheiro suficiente.', can ? () => this.chooseDay('tux') : null));
      acts.appendChild(this.actionButton('Usar o uniforme do hotel', '', 'Quem trabalha cá veste a casa.', () => this.chooseDay('uniform')));
    } else {
      p.appendChild(el('h3', null, 'Como passas o dia?'));
      acts.appendChild(this.actionButton('Descansar até tarde', '', 'Começas a próxima noite às 19:00 — uma hora extra de turno.', () => this.chooseDay('rest')));
      acts.appendChild(this.actionButton('Turno extra na pastelaria', '+35 €', 'Chegas cansado: só começas às 21:00.', () => this.chooseDay('work')));
      acts.appendChild(this.actionButton('Passear pela cidade', '', 'Talvez encontres algo pelo caminho. Começas às 20:00.', () => this.chooseDay('city')));
    }
    p.appendChild(acts);
    panelWrap.appendChild(p);
  },
  chooseDay(opt) {
    if (state.phase !== 'day') return;
    if (opt === 'tux') {
      if (state.money < 50) return;
      state.money -= 50;
      state.flags.tux = true;
      for (const c of CHAR_IDS) if (state.chap[c] >= 2 && !(c === 'luna' && state.flags.luna_closed)) addAff(c, 3);
    } else if (opt === 'uniform') {
      state.flags.uniform = true;
    } else if (opt === 'rest') {
      state.nextStart = 1140;
    } else if (opt === 'work') {
      state.nextStart = 1260;
      addMoney(35);
    } else if (opt === 'city') {
      state.nextStart = 1200;
      const found = pick(['rosa', 'chocolate', 'poesia', 'pinceis', 'vinil']);
      if (addItem(found)) UI.toast(`Encontraste: ${ITEMS[found].icon} ${ITEMS[found].name}`, 'good');
      else { addMoney(10); UI.toast('Já não cabia mais nada na mochila.', 'info'); }
    }
    state.day += 1;
    state.phase = 'night';
    state.time = state.day >= GALA_NIGHT ? 1260 : state.nextStart;
    state.loc = 'rececao';
    $('#dayPanel').classList.add('hidden');
    writeSlot('auto');
    this.resume();
  },

  /* ---------- Gala e final ---------- */
  startGala() {
    state.loc = 'rececao';
    state.ending = null;
    UI.refreshHud();
    Engine.start(galaScene(), () => this.showEnding(state.ending || 'solitario'));
  },
  showEnding(id) {
    if (!ENDINGS[id]) id = 'solitario';
    unlockEnding(id);
    UI.hideChar();
    const bgMap = { victoria: 'suite', luna: 'terraco', sophie: 'jardim', solitario: 'rua', dividido: 'rua' };
    const bg = $('#endBg');
    bg.className = 'end-bg';
    bg.innerHTML = '';
    bg.appendChild(makeBg(bgMap[id]));
    document.documentElement.style.setProperty('--sky1', '#2a2a5a');
    document.documentElement.style.setProperty('--sky2', '#d98a8a');
    document.documentElement.style.setProperty('--stars', '.3');
    $('#endKicker').textContent = 'Final ' + (Object.keys(ENDINGS).indexOf(id) + 1) + ' de ' + Object.keys(ENDINGS).length;
    $('#endTitle').textContent = ENDINGS[id].title;
    const tx = $('#endText');
    tx.innerHTML = '';
    endingText(id, state).forEach((para, i) => {
      const pEl = el('p', null, para);
      pEl.style.animationDelay = (i * 0.25) + 's';
      tx.appendChild(pEl);
    });
    UI.screen('ending');
    $('#ending').scrollTop = 0;
  }
};

/* =====================================================================
   MENUS E MODAIS
   ===================================================================== */
const Menus = {
  storageWarning(box) {
    if (!Store.ok) box.appendChild(el('p', 'err', 'O armazenamento local não está disponível neste navegador (modo privado ou bloqueado). Não é possível gravar nem carregar.'));
  },
  newGameDialog() {
    UI.openModal(box => {
      UI.modalHead(box, 'Nova história');
      box.appendChild(el('p', null, 'Como te chamas? É o nome pelo qual as personagens te vão tratar.'));
      const inp = el('input', 'input');
      inp.maxLength = 16; inp.placeholder = 'Alex'; inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Nome do jogador');
      box.appendChild(inp);
      const err = el('div', 'err');
      box.appendChild(err);
      const auto = readSlot('auto');
      if (auto.state) box.appendChild(el('p', null, 'Nota: a gravação automática atual será substituída no fim da primeira noite.'));
      const f = el('div', 'modal-foot');
      const cancel = el('button', 'btn', 'Cancelar');
      cancel.addEventListener('click', () => UI.closeModal());
      const go = el('button', 'btn primary', 'Começar');
      const start = () => {
        const name = (inp.value.trim() || 'Alex').replace(/\s+/g, ' ');
        if (name.length > 16) { err.textContent = 'O nome pode ter no máximo 16 caracteres.'; return; }
        if (!/^[\p{L}\p{N}][\p{L}\p{N} '\-.]*$/u.test(name)) { err.textContent = 'Usa apenas letras, números, espaços, hífens ou apóstrofos.'; return; }
        UI.closeModal();
        Game.newGame(name);
      };
      go.addEventListener('click', start);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
      f.append(cancel, go);
      box.appendChild(f);
    }, true);
  },
  slotRow(id, mode, rerender) {
    const r = readSlot(id);
    const row = el('div', 'row');
    const g = el('div', 'grow');
    g.appendChild(el('div', 'title', id === 'auto' ? 'Gravação automática' : 'Espaço ' + id));
    let desc = 'Vazio';
    if (r.corrupt) desc = 'Gravação corrompida ou incompatível.';
    else if (r.state) desc = slotLabel(r.state) + ' · ' + r.state.name + (r.savedAt ? ' · ' + new Date(r.savedAt).toLocaleString('pt-PT') : '');
    g.appendChild(el('div', 'desc', desc));
    row.appendChild(g);
    const btns = el('div', 'btns');
    if (mode === 'save' && id !== 'auto') {
      const b = el('button', 'btn small primary', 'Gravar aqui');
      b.disabled = !Store.ok;
      b.addEventListener('click', () => {
        const doSave = () => {
          if (writeSlot(id)) UI.toast('Jogo gravado no espaço ' + id + '.', 'good');
          else UI.toast('Não foi possível gravar (armazenamento indisponível ou cheio).', 'bad');
          rerender();
        };
        if (r.state || r.corrupt) UI.confirm('Substituir gravação?', 'O espaço ' + id + ' já tem uma gravação. Queres substituí-la?', 'Substituir', () => { doSave(); Menus.saveMenu(); });
        else doSave();
      });
      btns.appendChild(b);
    }
    if (mode === 'load') {
      const b = el('button', 'btn small primary', 'Carregar');
      b.disabled = !r.state;
      b.addEventListener('click', () => {
        const fresh = readSlot(id);
        if (!fresh.state) { UI.toast('Esta gravação já não existe ou está corrompida.', 'bad'); rerender(); return; }
        const go = () => Game.load(fresh.state);
        if (state && $('#game').classList.contains('active')) UI.confirm('Carregar jogo?', 'O progresso não gravado desta sessão será perdido.', 'Carregar', go);
        else go();
      });
      btns.appendChild(b);
    }
    if (r.state || r.corrupt) {
      const d = el('button', 'btn small danger', 'Apagar');
      d.addEventListener('click', () => UI.confirm('Apagar gravação?', 'Esta ação não pode ser desfeita.', 'Apagar', () => {
        Store.del(KEYS.slot(id)); UI.toast('Gravação apagada.', 'info');
        if (mode === 'save') Menus.saveMenu(); else Menus.loadMenu();
        refreshMenu();
      }, true));
      btns.appendChild(d);
    }
    row.appendChild(btns);
    return row;
  },
  saveMenu() {
    if (Engine.running) { UI.toast('Não é possível gravar a meio de um diálogo.', 'bad'); return; }
    const build = box => {
      UI.modalHead(box, 'Gravar jogo');
      this.storageWarning(box);
      const list = el('div', 'list');
      for (const id of ['1', '2', '3']) list.appendChild(this.slotRow(id, 'save', () => this.saveMenu()));
      box.appendChild(list);
      box.appendChild(el('p', null, 'O jogo também grava automaticamente no fim de cada noite e ao começar a seguinte.'));
    };
    UI.openModal(build);
  },
  loadMenu() {
    UI.openModal(box => {
      UI.modalHead(box, 'Carregar jogo');
      this.storageWarning(box);
      const list = el('div', 'list');
      for (const id of SLOTS) list.appendChild(this.slotRow(id, 'load', () => this.loadMenu()));
      box.appendChild(list);
    });
  },
  settingsMenu() {
    const seg = (label, key, opts) => {
      const row = el('div', 'setting');
      row.appendChild(el('span', null, label));
      const s = el('div', 'seg');
      for (const [val, text] of opts) {
        const b = el('button', settings[key] === val ? 'on' : '', text);
        b.addEventListener('click', () => { settings[key] = val; saveSettings(); UI.applySettings(); this.settingsMenu(); });
        s.appendChild(b);
      }
      row.appendChild(s);
      return row;
    };
    UI.openModal(box => {
      UI.modalHead(box, 'Configurações');
      box.appendChild(seg('Velocidade do texto', 'textSpeed', [['slow', 'Lenta'], ['normal', 'Normal'], ['fast', 'Rápida'], ['instant', 'Instantânea']]));
      box.appendChild(seg('Avanço automático', 'autoSpeed', [['slow', 'Lento'], ['normal', 'Normal'], ['fast', 'Rápido']]));
      box.appendChild(seg('Tamanho do texto', 'bigText', [[false, 'Normal'], [true, 'Grande']]));
      box.appendChild(seg('Animações', 'reduceMotion', [[false, 'Ativadas'], [true, 'Reduzidas']]));
      box.appendChild(seg('Mostrar alterações de afinidade', 'showAff', [[true, 'Sim'], [false, 'Não']]));
      const row = el('div', 'setting');
      row.appendChild(el('span', null, 'Apagar gravações, finais e configurações'));
      const b = el('button', 'btn small danger', 'Apagar tudo');
      b.addEventListener('click', () => UI.confirm('Apagar todos os dados?', 'Todas as gravações, finais desbloqueados e configurações serão apagados deste navegador.', 'Apagar tudo', () => {
        for (const id of SLOTS) Store.del(KEYS.slot(id));
        Store.del(KEYS.endings); Store.del(KEYS.settings);
        settings = Object.assign({}, DEFAULT_SETTINGS); UI.applySettings();
        UI.toast('Dados apagados.', 'info'); refreshMenu();
      }, true));
      row.appendChild(b);
      box.appendChild(row);
      this.storageWarning(box);
      box.appendChild(el('p', null, 'Atalhos: Espaço/Enter avança o texto · 1–4 escolhem opções · Esc abre o menu.'));
    });
  },
  pauseMenu() {
    if (!state) return;
    UI.openModal(box => {
      UI.modalHead(box, 'Menu');
      const list = el('div', 'list');
      const item = (label, desc, fn, disabled) => {
        const b = el('button', 'action');
        const l = el('span'); l.appendChild(el('span', 'label', label)); if (desc) l.appendChild(el('span', 'why', desc));
        b.appendChild(l);
        b.disabled = !!disabled;
        if (!disabled) b.addEventListener('click', fn);
        list.appendChild(b);
      };
      item('Retomar', null, () => UI.closeModal());
      item('Gravar', Engine.running ? 'Disponível fora dos diálogos.' : (Store.ok ? null : 'Armazenamento indisponível.'), () => this.saveMenu(), Engine.running || !Store.ok);
      item('Carregar', null, () => this.loadMenu());
      item('Histórico de diálogo', null, () => this.logMenu());
      item('Configurações', null, () => this.settingsMenu());
      item('Reiniciar a história', 'Recomeça da primeira noite com o mesmo nome.', () => UI.confirm('Reiniciar a história?', 'Vais voltar à primeira noite. O progresso não gravado será perdido.', 'Reiniciar', () => Game.newGame(state.name), true));
      item('Voltar ao menu inicial', 'O progresso não gravado será perdido.', () => UI.confirm('Voltar ao menu inicial?', 'O progresso não gravado desde a última gravação será perdido.', 'Sair', () => goMenu()));
      box.appendChild(list);
    }, true);
  },
  logMenu() {
    UI.openModal(box => {
      UI.modalHead(box, 'Histórico');
      if (!UI.logLines.length) box.appendChild(el('p', null, 'Ainda não há diálogo nesta sessão.'));
      const wrap = el('div');
      for (const l of UI.logLines) {
        const d = el('div', 'log-line');
        if (l.who) { d.appendChild(el('b', null, l.who + ': ')); }
        d.appendChild(document.createTextNode(l.text));
        wrap.appendChild(d);
      }
      box.appendChild(wrap);
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 20);
    });
  },
  relMenu() {
    if (!state) return;
    UI.openModal(box => {
      UI.modalHead(box, 'Relações');
      const list = el('div', 'list');
      for (const c of CHAR_IDS) {
        const ch = CHARS[c];
        const card = el('div', 'rel-card');
        const mini = el('div', 'mini');
        const mood = (c === 'luna' && state.flags.luna_closed) ? 'sad' : state.aff[c] >= 60 ? 'flirty' : state.aff[c] >= 25 ? 'smile' : 'neutral';
        mini.appendChild(makePortrait(c, mood, false));
        card.appendChild(mini);
        const info = el('div');
        info.appendChild(el('h4', null, ch.full + ', ' + ch.age));
        info.appendChild(el('div', 'role', ch.role));
        const bar = el('div', 'bar'); const fillb = el('i'); fillb.style.width = state.aff[c] + '%'; fillb.style.background = ch.color; bar.appendChild(fillb);
        info.appendChild(bar);
        const meta = el('div', 'rel-meta');
        meta.append(el('span', null, 'Afinidade: ' + state.aff[c] + '/100'), el('span', null, affLevel(state.aff[c])));
        info.appendChild(meta);
        const dots = el('div', 'chap-dots');
        dots.title = 'Capítulos da história';
        for (let i = 1; i <= 5; i++) { const d = el('i', i <= state.chap[c] ? 'on' : ''); if (i <= state.chap[c]) d.style.background = ch.color; dots.appendChild(d); }
        info.appendChild(dots);
        info.appendChild(el('p', 'bio', ch.bio.slice(0, state.chap[c] + 1).join(' ')));
        const status = [];
        if (state.flags['promise_' + c]) status.push('Prometeste-lhe o teu coração.');
        if (state.flags[c + '_declined']) status.push('Ficaram apenas amigos.');
        if (c === 'luna' && state.flags.luna_closed) status.push('A Luna deixou de falar contigo.');
        else if (c === 'luna' && state.flags.luna_betrayed && !state.flags.luna_forgiven) status.push('Contaste o segredo dela à Victoria.');
        if (status.length) info.appendChild(el('div', 'invite', status.join(' ')));
        const inv = state.invites[c];
        if (inv) info.appendChild(el('div', 'invite', `✦ Encontro: ${LOCS[inv.loc].name}, ${fmtTime(inv.from)}–${fmtTime(inv.to)} (Noite ${inv.day}).`));
        const known = Object.keys(state.known[c]);
        info.appendChild(el('div', 'likes', known.length ? 'Gostos descobertos: ' + known.map(i => ITEMS[i].name + ' (' + REACTION_LABEL[state.known[c][i]] + ')').join(', ') + '.' : 'Ainda não sabes do que gosta. Experimenta oferecer-lhe algo.'));
        info.appendChild(el('div', 'likes', ch.where));
        card.appendChild(info);
        list.appendChild(card);
      }
      box.appendChild(list);
    });
  },
  inventory(giftTo) {
    if (!state) return;
    UI.openModal(box => {
      UI.modalHead(box, giftTo ? 'Oferecer à ' + CHARS[giftTo].name : 'Inventário');
      const list = el('div', 'list');
      const owned = ITEM_IDS.filter(i => state.inv[i] > 0);
      if (!owned.length) box.appendChild(el('p', null, 'Não tens nada. A Boutique Noir, ao pé do elevador, vende presentes das 18:00 às 03:00.'));
      for (const i of owned) {
        const it = ITEMS[i];
        const row = el('div', 'row');
        row.appendChild(el('div', 'ico', it.icon));
        const g = el('div', 'grow');
        g.appendChild(el('div', 'title', it.name + ' × ' + state.inv[i]));
        let d = it.desc;
        if (giftTo && state.known[giftTo][i]) d += ' · Ela ' + REACTION_LABEL[state.known[giftTo][i]] + ' disto.';
        g.appendChild(el('div', 'desc', d));
        row.appendChild(g);
        if (giftTo) {
          const b = el('button', 'btn small primary', 'Oferecer');
          b.addEventListener('click', () => Game.giveGift(giftTo, i));
          row.appendChild(b);
        }
        list.appendChild(row);
      }
      box.appendChild(list);
    });
  },
  shop() {
    const build = box => {
      UI.modalHead(box, 'Boutique Noir');
      box.appendChild(el('p', null, `Tens ${state.money} €. Comprar não gasta tempo. Podes levar até 9 unidades de cada artigo.`));
      const list = el('div', 'list');
      for (const i of ITEM_IDS) {
        const it = ITEMS[i];
        const row = el('div', 'row');
        row.appendChild(el('div', 'ico', it.icon));
        const g = el('div', 'grow');
        g.appendChild(el('div', 'title', it.name + ' · ' + it.price + ' €'));
        g.appendChild(el('div', 'desc', it.desc + (state.inv[i] ? ` (Tens ${state.inv[i]}.)` : '')));
        row.appendChild(g);
        const b = el('button', 'btn small primary', 'Comprar');
        const full = (state.inv[i] || 0) >= 9;
        b.disabled = state.money < it.price || full;
        if (full) b.title = 'Já tens o máximo.'; else if (state.money < it.price) b.title = 'Dinheiro insuficiente.';
        b.addEventListener('click', () => {
          if (state.money < it.price || (state.inv[i] || 0) >= 9) return;
          state.money -= it.price;
          addItem(i);
          UI.toast(`Compraste: ${it.icon} ${it.name} (−${it.price} €)`, 'good');
          UI.refreshHud();
          UI.openModal(build);
        });
        row.appendChild(b);
        list.appendChild(row);
      }
      box.appendChild(list);
    };
    UI.openModal(build);
  },
  endingsMenu() {
    UI.openModal(box => {
      UI.modalHead(box, 'Finais desbloqueados');
      const got = getEndings();
      box.appendChild(el('p', null, `${got.filter(x => ENDINGS[x]).length} de ${Object.keys(ENDINGS).length} finais descobertos.`));
      const grid = el('div', 'ending-grid');
      for (const id of Object.keys(ENDINGS)) {
        const on = got.includes(id);
        const card = el('div', 'ending-card' + (on ? ' on' : ''));
        card.appendChild(el('h4', null, on ? ENDINGS[id].title : '???'));
        card.appendChild(el('p', null, on ? ENDINGS[id].teaser : 'Por descobrir.'));
        grid.appendChild(card);
      }
      box.appendChild(grid);
    });
  }
};
Game.openInventory = c => Menus.inventory(c);
Game.openShop = () => {
  if (!canEnter(state, 'boutique').ok) { UI.toast('A boutique está fechada.', 'bad'); return; }
  Menus.shop();
};

/* =====================================================================
   MENU INICIAL E ARRANQUE
   ===================================================================== */
function refreshMenu() {
  const last = latestSave();
  const btn = $('#btnContinue');
  btn.disabled = !last;
  $('#continueSub').textContent = last ? '· ' + slotLabel(last.state) : '· sem gravações';
}
function goMenu() {
  Engine.abort();
  UI.closeModal();
  UI.leaveDialogue();
  $('#hub').classList.add('hidden');
  $('#dayPanel').classList.add('hidden');
  $('#charLayer').innerHTML = '';
  state = null;
  refreshMenu();
  UI.screen('menu');
}

function init() {
  loadSettings();
  UI.applySettings();
  // fundo e retratos do menu
  $('#menuBg').innerHTML = BG_HTML.rua;
  const mp = $('#menuPortraits');
  ['victoria', 'luna', 'sophie'].forEach((c, i) => mp.appendChild(makePortrait(c, ['smirk', 'flirty', 'shy'][i], true)));
  refreshMenu();
  if (!Store.ok) setTimeout(() => UI.toast('Aviso: o armazenamento local está indisponível — não será possível gravar.', 'bad'), 400);

  $('#btnNew').addEventListener('click', () => Menus.newGameDialog());
  $('#btnContinue').addEventListener('click', () => {
    const last = latestSave();
    if (!last) { UI.toast('Não existem gravações válidas.', 'bad'); refreshMenu(); return; }
    Game.load(last.state);
  });
  $('#btnLoad').addEventListener('click', () => Menus.loadMenu());
  $('#btnSettings').addEventListener('click', () => Menus.settingsMenu());
  $('#btnEndings').addEventListener('click', () => Menus.endingsMenu());
  $('#btnRel').addEventListener('click', () => Menus.relMenu());
  $('#btnInv').addEventListener('click', () => Menus.inventory(null));
  $('#btnPause').addEventListener('click', () => Menus.pauseMenu());
  $('#btnLog').addEventListener('click', e => { e.stopPropagation(); Menus.logMenu(); });
  $('#btnAuto').addEventListener('click', e => { e.stopPropagation(); UI.toggleAuto(); });
  $('#dialogue').addEventListener('click', () => UI.advance());
  $('#btnEndMenu').addEventListener('click', () => goMenu());
  $('#btnEndNew').addEventListener('click', () => { goMenu(); Menus.newGameDialog(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') UI.closeModal(); });

  document.addEventListener('keydown', e => {
    const modalOpen = !$('#modal').classList.contains('hidden');
    if (e.key === 'Escape') {
      if (modalOpen) { UI.closeModal(); return; }
      if ($('#game').classList.contains('active')) Menus.pauseMenu();
      return;
    }
    if (modalOpen) return;
    if (!$('#game').classList.contains('active')) return;
    const choices = $('#choices');
    if (!choices.classList.contains('hidden')) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) { const b = choices.querySelectorAll('button')[n - 1]; if (b) { e.preventDefault(); b.click(); } }
      return;
    }
    if ((e.key === ' ' || e.key === 'Enter') && !$('#dialogue').classList.contains('hidden')) {
      if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.dctrl')) return;
      e.preventDefault();
      UI.advance();
    }
  });
  window.addEventListener('error', ev => { UI.toast('Ocorreu um erro inesperado: ' + (ev.message || 'desconhecido'), 'bad'); });
}
document.addEventListener('DOMContentLoaded', init);
</script>
