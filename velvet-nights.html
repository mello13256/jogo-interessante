<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050b">
<meta name="description" content="Velvet Nights — um romance interativo noturno no Hotel Velvet.">
<title>Velvet Nights</title>
<style>
/* ================= BASE ================= */
:root{
  --bg:#07050b; --panel:rgba(17,10,24,.80); --panel-2:rgba(32,17,42,.88); --line:rgba(255,255,255,.09);
  --text:#f4ebf2; --muted:#b9a7ba; --gold:#d9b56c; --gold-2:#f3dca0; --rose:#ff4f93; --violet:#9b6bff; --cyan:#44e6d8;
  --c-victoria:#e8b04a; --c-luna:#b896ff; --c-sophie:#ff7fae; --c-marcel:#a9bdd2; --c-player:#e7d9cc;
  --serif:'Didot','Bodoni 72','Bodoni MT','Playfair Display','Cormorant Garamond','Garamond','Baskerville','Georgia',serif;
  --sans:'Avenir Next','Avenir','Segoe UI','Helvetica Neue','Helvetica',Arial,sans-serif;
  --fs:1;
  --sky1:#07061a; --sky2:#1d0e33; --stars:1; --sun:0;
  --pscale:min(1.75vh, 2.6vw);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
body.large-text{--fs:1.18;}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
button:disabled{cursor:not-allowed;}
.hidden{display:none !important;}
.screen{position:fixed;inset:0;display:none;}
.screen.active{display:block;}
.fade-in{animation:fadeIn .6s ease both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1;text-shadow:0 0 6px #fff,0 0 18px var(--rose),0 0 42px var(--rose),0 0 80px var(--violet);}
  20%,24%,55%{opacity:.55;text-shadow:none;}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-100vh)}}
@keyframes rain{from{background-position:0 0}to{background-position:-60px 600px}}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none !important;transition:none !important;}

/* ================= BOTÕES ================= */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  padding:.8em 1.4em;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));
  color:var(--text);letter-spacing:.04em;transition:all .25s ease;font-size:calc(.95rem * var(--fs));}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--rose);box-shadow:0 0 0 1px rgba(255,79,147,.35),0 0 22px rgba(255,79,147,.25);outline:none;}
.btn:disabled{opacity:.42;}
.btn.primary{background:linear-gradient(135deg,rgba(255,79,147,.35),rgba(155,107,255,.3));border-color:rgba(255,79,147,.55);}
.btn.gold{border-color:rgba(217,181,108,.6);color:var(--gold-2);}
.btn.small{padding:.45em .9em;font-size:calc(.8rem * var(--fs));}
.btn.danger{border-color:rgba(255,90,90,.5);color:#ffb3b3;}
.icon-btn{display:inline-flex;align-items:center;gap:.35em;padding:.45em .8em;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,6,14,.55);color:var(--text);font-size:calc(.8rem * var(--fs));letter-spacing:.05em;transition:all .2s;}
.icon-btn:hover,.icon-btn:focus-visible{border-color:var(--rose);outline:none;}
.icon-btn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(68,230,216,.3);}

/* ================= MENU INICIAL ================= */
#menu{background:#07040b;overflow:hidden;}
#menu .menu-bg{position:absolute;inset:0;}
#menu .menu-bg .sign,#menu .menu-bg .facade::before{display:none;}
#menu .menu-portraits{position:absolute;left:0;right:0;bottom:-16vh;display:flex;justify-content:center;align-items:flex-end;gap:0;opacity:.26;
  filter:saturate(.9) blur(.6px);pointer-events:none;--pscale:min(1.6vh,2.2vw);}
#menu .menu-portraits .portrait{margin:0 -3em;}
#menu .menu-portraits .portrait:nth-child(2){transform:translateY(-3vh) scale(1.08);z-index:2;}
#menu .menu-portraits::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#07040b 92%);}
.menu-inner{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 16px;text-align:center;}
.logo{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(3rem,10vw,7.5rem);line-height:.95;margin:0;color:#fff4fa;
  animation:flicker 7s infinite;letter-spacing:.02em;}
.logo small{display:block;font-style:normal;font-family:var(--sans);font-size:.14em;letter-spacing:.7em;color:var(--gold);margin-top:1.1em;text-shadow:none;animation:none;}
.tagline{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:calc(1.05rem * var(--fs));margin:1.4em 0 2em;max-width:34em;}
.menu-buttons{display:flex;flex-direction:column;gap:.7em;width:min(320px,90vw);}
.menu-buttons .btn{width:100%;}
.menu-note{margin-top:2em;font-size:.75rem;color:rgba(255,255,255,.45);max-width:36em;line-height:1.5;}
.btn .sub{font-size:.75em;color:var(--muted);}

/* ================= CENÁRIO ================= */
#stage{position:absolute;inset:0;overflow:hidden;background:#000;}
.loc{position:absolute;inset:0;transition:opacity .8s ease;}
.loc > div{position:absolute;}
.sky{inset:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%);}
.stars{inset:0;opacity:var(--stars);background:
  radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 55% 15%,#fff,transparent),radial-gradient(1px 1px at 72% 28%,#fff,transparent),
  radial-gradient(1px 1px at 88% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 18% 38%,#fff,transparent),
  radial-gradient(1px 1px at 44% 30%,#fff,transparent),radial-gradient(1px 1px at 63% 42%,#fff,transparent),
  radial-gradient(1px 1px at 93% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 4% 6%,#fff,transparent);}
.city{left:0;right:0;bottom:0;height:46%;background:
  linear-gradient(180deg,transparent 0 0),
  repeating-linear-gradient(90deg,rgba(255,214,140,.55) 0 2px,transparent 2px 9px),#0b0814;
  -webkit-mask:linear-gradient(#000,#000);
  clip-path:polygon(0 40%,6% 40%,6% 22%,11% 22%,11% 48%,16% 48%,16% 12%,19% 8%,22% 12%,22% 44%,28% 44%,28% 30%,34% 30%,34% 52%,39% 52%,39% 18%,45% 18%,45% 36%,50% 36%,50% 6%,53% 0,56% 6%,56% 40%,62% 40%,62% 24%,68% 24%,68% 50%,73% 50%,73% 14%,79% 14%,79% 38%,85% 38%,85% 26%,90% 26%,90% 46%,95% 46%,95% 20%,100% 20%,100% 100%,0 100%);}
.city::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(11,8,20,.9) 6px 14px);}
.city.far{height:54%;opacity:.45;filter:blur(1px);transform:scaleX(1.3);}
.moon{width:9vmin;height:9vmin;border-radius:50%;right:14%;top:12%;opacity:calc(var(--stars) * .95);
  background:radial-gradient(circle at 38% 38%,#fffbea,#e9dfc8 55%,#cfc3a8);box-shadow:0 0 40px 10px rgba(255,240,210,.25),0 0 120px 40px rgba(155,107,255,.12);}
.vignette{inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%);pointer-events:none;}
.neon-text{font-family:var(--serif);font-style:italic;color:#fff;white-space:nowrap;}

/* Rua */
.loc-rua{background:linear-gradient(180deg,#0b0716,#1a0d22 60%,#09060c);}
.loc-rua .facade{left:18%;right:18%;top:10%;bottom:22%;background:
  repeating-linear-gradient(90deg,#140c18 0 46px,#1c1220 46px 50px),#140c18;box-shadow:0 0 80px rgba(255,79,147,.15);}
.loc-rua .facade::before{content:'';position:absolute;left:35%;right:35%;bottom:0;height:42%;border-radius:999px 999px 0 0;
  background:linear-gradient(180deg,rgba(255,200,120,.6),rgba(255,140,90,.25));box-shadow:0 0 60px rgba(255,190,120,.5);}
.loc-rua .sign{left:50%;top:15%;transform:translateX(-50%);font-size:clamp(2rem,6vw,4.4rem);animation:flicker 6s infinite;letter-spacing:.12em;}
.loc-rua .street{left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#120a18,#050307);}
.loc-rua .street::after{content:'';position:absolute;left:30%;right:30%;top:0;height:100%;background:radial-gradient(ellipse at 50% 0,rgba(255,79,147,.35),transparent 70%);}
.loc-rua .rain{inset:0;opacity:.35;background-image:repeating-linear-gradient(105deg,transparent 0 22px,rgba(200,210,255,.35) 22px 23px,transparent 23px 60px);
  background-size:120px 120px;animation:rain .6s linear infinite;}

/* Receção */
.loc-rececao{background:linear-gradient(180deg,#1a0f13 0%,#24131a 55%,#120a0d 100%);}
.loc-rececao .win{top:8%;width:15%;height:48%;border-radius:999px 999px 0 0;overflow:hidden;
  border:3px solid rgba(217,181,108,.55);box-shadow:0 0 30px rgba(0,0,0,.6) inset;}
.loc-rececao .win .sky,.loc-rececao .win .stars,.loc-rececao .win .city{position:absolute;}
.loc-rececao .win::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(217,181,108,.5) 48% 52%,transparent 52%),linear-gradient(180deg,transparent 58%,rgba(217,181,108,.5) 58% 60%,transparent 60%);}
.loc-rececao .w1{left:6%;} .loc-rececao .w2{left:42.5%;} .loc-rececao .w3{right:6%;}
.loc-rececao .col{top:0;bottom:24%;width:4%;background:linear-gradient(90deg,#3a2128,#6b4048 40%,#2a161c);}
.loc-rececao .c1{left:27%;} .loc-rececao .c2{right:27%;}
.loc-rececao .chand{left:50%;top:-2%;width:30vmin;height:22vmin;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 60%,rgba(255,220,150,.75) 0%,rgba(255,200,120,.25) 30%,transparent 65%);}
.loc-rececao .chand::after{content:'';position:absolute;left:20%;right:20%;top:50%;height:22%;border-radius:0 0 50% 50%;
  border-bottom:2px dotted rgba(255,236,190,.9);border-left:1px solid rgba(255,236,190,.3);border-right:1px solid rgba(255,236,190,.3);}
.loc-rececao .desk{left:8%;right:8%;bottom:0;height:24%;background:linear-gradient(180deg,#3b1d22,#1e0d11);
  border-top:3px solid var(--gold);box-shadow:0 -10px 40px rgba(0,0,0,.6);}
.loc-rececao .desk::after{content:'VELVET';position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--serif);letter-spacing:.6em;
  color:var(--gold);font-size:clamp(.9rem,2.4vw,1.6rem);text-shadow:0 0 12px rgba(217,181,108,.5);}
.loc-rececao .glow{inset:0;background:radial-gradient(ellipse at 50% 15%,rgba(255,200,120,.18),transparent 55%);}

/* Bar */
.loc-bar{background:linear-gradient(180deg,#1b0612 0%,#2a0a1c 50%,#0d0309 100%);}
.loc-bar .shelf{left:10%;right:10%;top:22%;height:38%;
  background:
    repeating-linear-gradient(180deg,transparent 0 31%,rgba(217,181,108,.55) 31% 32.5%),
    repeating-linear-gradient(90deg,rgba(255,120,170,.0) 0 14px,rgba(255,170,200,.18) 14px 22px,rgba(140,255,230,.12) 22px 28px,transparent 28px 40px);
  box-shadow:inset 0 0 60px rgba(0,0,0,.7);}
.loc-bar .sign{left:50%;top:6%;transform:translateX(-50%);font-size:clamp(1.8rem,5.4vw,4rem);animation:flicker 9s infinite;}
.loc-bar .counter{left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#2c0c17,#0e0307);border-top:2px solid rgba(255,79,147,.6);
  box-shadow:0 -4px 30px rgba(255,79,147,.35);}
.loc-bar .bokeh{inset:0;background:
  radial-gradient(circle at 12% 70%,rgba(255,79,147,.25) 0 2.5vmin,transparent 3vmin),
  radial-gradient(circle at 85% 30%,rgba(155,107,255,.25) 0 3vmin,transparent 3.5vmin),
  radial-gradient(circle at 70% 75%,rgba(217,181,108,.2) 0 2vmin,transparent 2.5vmin),
  radial-gradient(circle at 25% 20%,rgba(68,230,216,.15) 0 2vmin,transparent 2.6vmin);}

/* Terraço */
.loc-terraco .rail{left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,#0e0a14,#050307);border-top:3px solid rgba(155,107,255,.8);
  box-shadow:0 -6px 30px rgba(155,107,255,.45);}
.loc-terraco .rail::before{content:'';position:absolute;left:0;right:0;top:-12vh;height:12vh;
  background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(30,22,40,.9) 60px 64px);}
.loc-terraco .pool{left:8%;width:34%;bottom:4%;height:9%;border-radius:8px;background:linear-gradient(180deg,rgba(68,230,216,.25),rgba(155,107,255,.2));
  box-shadow:0 0 30px rgba(68,230,216,.25);}

/* Boutique */
.loc-boutique{background:radial-gradient(ellipse at 50% 20%,#2c1a26,#120a10 70%);}
.loc-boutique .shelves{left:6%;right:6%;top:14%;height:56%;background:
  repeating-linear-gradient(180deg,transparent 0 30%,rgba(217,181,108,.6) 30% 31%),
  radial-gradient(circle at 15% 22%,rgba(255,79,147,.6) 0 1.6vmin,transparent 1.8vmin),
  radial-gradient(circle at 38% 22%,rgba(217,181,108,.7) 0 1.4vmin,transparent 1.6vmin),
  radial-gradient(circle at 62% 55%,rgba(155,107,255,.6) 0 1.6vmin,transparent 1.8vmin),
  radial-gradient(circle at 84% 55%,rgba(68,230,216,.5) 0 1.4vmin,transparent 1.6vmin),
  radial-gradient(circle at 28% 86%,rgba(255,200,140,.6) 0 1.5vmin,transparent 1.7vmin),
  radial-gradient(circle at 74% 86%,rgba(255,79,147,.5) 0 1.4vmin,transparent 1.6vmin);}
.loc-boutique .sign{left:50%;top:4%;transform:translateX(-50%);font-size:clamp(1.4rem,4vw,2.8rem);color:var(--gold-2);text-shadow:0 0 18px rgba(217,181,108,.6);}
.loc-boutique .floor{left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,#1a0f15,#060305);}

/* Sala dos funcionários */
.loc-funcionarios{background:linear-gradient(180deg,#141216,#0b0a0d);}
.loc-funcionarios .lockers{left:4%;right:40%;top:14%;bottom:16%;background:
  repeating-linear-gradient(90deg,#2b2a33 0 11%,#1a1920 11% 12%),#2b2a33;}
.loc-funcionarios .lockers::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 3%,rgba(0,0,0,.4) 3% 3.4%,transparent 3.4% 12%),
  repeating-linear-gradient(180deg,transparent 0 8%,rgba(0,0,0,.35) 8% 9%,transparent 9% 100%);}
.loc-funcionarios .lamp{left:70%;top:0;width:30vmin;height:80%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 0,rgba(255,210,140,.45),transparent 65%);}
.loc-funcionarios .table{left:52%;right:6%;bottom:12%;height:6%;background:#3a2a20;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.6);}

/* Suite */
.loc-suite{background:#0b0610;}
.loc-suite .bigwin{left:12%;right:12%;top:6%;bottom:20%;overflow:hidden;border:2px solid rgba(217,181,108,.35);}
.loc-suite .bigwin .sky,.loc-suite .bigwin .stars,.loc-suite .bigwin .city,.loc-suite .bigwin .moon{position:absolute;}
.loc-suite .curtain{top:0;bottom:0;width:20%;background:repeating-linear-gradient(90deg,#3a0716 0 18px,#5a0e24 18px 30px,#2a0410 30px 40px);
  box-shadow:inset 0 0 50px rgba(0,0,0,.7);}
.loc-suite .cl{left:0;} .loc-suite .cr{right:0;}
.loc-suite .floor{left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,#1a0a12,#050205);}

/* Estúdio 707 */
.loc-estudio{background:radial-gradient(ellipse at 40% 30%,#1a1030,#07040c 75%);}
.loc-estudio .tube{height:.8vmin;border-radius:999px;}
.loc-estudio .t1{left:8%;top:14%;width:34%;background:var(--cyan);box-shadow:0 0 14px var(--cyan),0 0 40px var(--cyan);transform:rotate(-8deg);}
.loc-estudio .t2{right:6%;top:24%;width:28%;background:var(--rose);box-shadow:0 0 14px var(--rose),0 0 40px var(--rose);transform:rotate(12deg);}
.loc-estudio .t3{left:40%;top:6%;width:22%;background:var(--violet);box-shadow:0 0 14px var(--violet),0 0 40px var(--violet);transform:rotate(3deg);}
.loc-estudio .canvas{border:4px solid #e9e2d8;box-shadow:0 10px 30px rgba(0,0,0,.6);}
.loc-estudio .cv1{left:6%;top:34%;width:18%;height:30%;background:linear-gradient(135deg,#ff4f93,#9b6bff 50%,#44e6d8);transform:rotate(-4deg);}
.loc-estudio .cv2{right:8%;top:40%;width:16%;height:26%;background:radial-gradient(circle at 50% 40%,#f3dca0 0 20%,#1b1430 22%),#1b1430;transform:rotate(5deg);}
.loc-estudio .cv3{left:28%;top:52%;width:12%;height:18%;background:linear-gradient(200deg,#0c6d66,#44e6d8 40%,#120b20);transform:rotate(2deg);}
.loc-estudio .splat{inset:0;background:
  radial-gradient(circle at 20% 85%,rgba(68,230,216,.5) 0 1vmin,transparent 1.3vmin),
  radial-gradient(circle at 26% 90%,rgba(255,79,147,.5) 0 .7vmin,transparent .9vmin),
  radial-gradient(circle at 72% 88%,rgba(155,107,255,.55) 0 1.2vmin,transparent 1.5vmin),
  radial-gradient(circle at 80% 80%,rgba(68,230,216,.4) 0 .6vmin,transparent .8vmin);}

/* Sala Escarlate */
.loc-escarlate{background:radial-gradient(ellipse at 50% 30%,#3a0612,#120206 70%);}
.loc-escarlate .curtains{left:0;right:0;top:0;height:70%;background:repeating-linear-gradient(90deg,#5c0a1d 0 3%,#7e1229 3% 5%,#3e0613 5% 7%);
  -webkit-mask:radial-gradient(ellipse at 50% 100%,transparent 30%,#000 31%);mask:radial-gradient(ellipse at 50% 100%,transparent 30%,#000 31%);}
.loc-escarlate .spot{left:50%;top:0;width:60vmin;height:100%;transform:translateX(-50%);
  background:conic-gradient(from 165deg at 50% 0,transparent 0deg,rgba(255,230,200,.18) 8deg,rgba(255,230,200,.18) 22deg,transparent 30deg);}
.loc-escarlate .stage{left:20%;right:20%;bottom:16%;height:8%;background:linear-gradient(180deg,#2a0b10,#0a0204);border-top:2px solid var(--gold);border-radius:50%/0 0 100% 100%;}
.loc-escarlate .candles{left:0;right:0;bottom:0;height:16%;background:
  radial-gradient(circle at 12% 40%,rgba(255,190,110,.8) 0 .5vmin,rgba(255,150,80,.25) 1vmin,transparent 4vmin),
  radial-gradient(circle at 34% 60%,rgba(255,190,110,.8) 0 .5vmin,rgba(255,150,80,.25) 1vmin,transparent 4vmin),
  radial-gradient(circle at 66% 50%,rgba(255,190,110,.8) 0 .5vmin,rgba(255,150,80,.25) 1vmin,transparent 4vmin),
  radial-gradient(circle at 88% 45%,rgba(255,190,110,.8) 0 .5vmin,rgba(255,150,80,.25) 1vmin,transparent 4vmin),#0a0204;}

/* Jardim de inverno */
.loc-jardim .glass{inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 12.5%,rgba(40,70,60,.85) 12.5% 13%),
  repeating-linear-gradient(180deg,transparent 0 16%,rgba(40,70,60,.85) 16% 16.6%);}
.loc-jardim .plants{left:0;right:0;bottom:0;height:42%;background:
  radial-gradient(ellipse at 8% 100%,#163a26 0 22%,transparent 23%),
  radial-gradient(ellipse at 24% 100%,#1e4a30 0 18%,transparent 19%),
  radial-gradient(ellipse at 78% 100%,#163a26 0 24%,transparent 25%),
  radial-gradient(ellipse at 94% 100%,#24563a 0 18%,transparent 19%),
  radial-gradient(circle at 18% 58%,#ff9ec4 0 .8vmin,transparent 1vmin),
  radial-gradient(circle at 84% 52%,#f3dca0 0 .8vmin,transparent 1vmin),
  radial-gradient(circle at 70% 66%,#ff9ec4 0 .7vmin,transparent .9vmin);}

/* Gala */
.loc-gala{background:radial-gradient(ellipse at 50% 20%,#4a3420,#1a0f0a 60%,#080404);}
.loc-gala .chand{top:-4%;width:26vmin;height:20vmin;background:radial-gradient(ellipse at 50% 55%,rgba(255,230,170,.85),rgba(255,200,120,.25) 35%,transparent 68%);}
.loc-gala .ch1{left:12%;} .loc-gala .ch2{left:50%;transform:translateX(-50%);width:36vmin;height:26vmin;} .loc-gala .ch3{right:12%;}
.loc-gala .confetti{inset:0;background:
  radial-gradient(circle at 10% 30%,var(--gold-2) 0 2px,transparent 3px),radial-gradient(circle at 30% 60%,var(--rose) 0 2px,transparent 3px),
  radial-gradient(circle at 55% 25%,var(--gold-2) 0 2px,transparent 3px),radial-gradient(circle at 75% 55%,var(--violet) 0 2px,transparent 3px),
  radial-gradient(circle at 90% 20%,var(--gold-2) 0 2px,transparent 3px),radial-gradient(circle at 42% 80%,var(--gold-2) 0 2px,transparent 3px);
  background-size:100% 100%;animation:pulse 3s ease-in-out infinite;}
.loc-gala .floor{left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2a1a10,#0a0503);border-top:2px solid rgba(217,181,108,.5);}

/* Dia */
.loc-dia{background:linear-gradient(180deg,#f7c59f 0%,#f3a6a1 35%,#a98bc2 75%,#5f5a8f 100%);}
.loc-dia .sun{left:50%;top:18%;width:22vmin;height:22vmin;margin-left:-11vmin;border-radius:50%;
  background:radial-gradient(circle,#fff6d8,#ffd27f 60%,rgba(255,180,100,0) 72%);box-shadow:0 0 120px 40px rgba(255,210,140,.55);}
.loc-dia .city{opacity:.85;}
.loc-dia .city{background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 9px),#3b2f55;}
.loc-dia .city::after{background:repeating-linear-gradient(180deg,transparent 0 6px,rgba(59,47,85,.92) 6px 14px);}

/* ================= HUD ================= */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:max(10px,env(safe-area-inset-top)) 16px 10px;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);}
#hud > *{pointer-events:auto;}
.clock{display:flex;align-items:center;gap:.7em;padding:.45em 1em .45em .5em;border-radius:999px;background:rgba(10,6,14,.6);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.clock .orb{width:28px;height:28px;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--sky1),var(--sky2));border:1px solid rgba(255,255,255,.25);position:relative;overflow:hidden;}
.clock .orb::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;left:8px;top:7px;
  background:radial-gradient(circle at 35% 35%,#fffbea,#e9dfc8);box-shadow:0 0 8px rgba(255,240,210,.6);}
.clock .orb.sun::after{background:radial-gradient(circle,#fff6d8,#ffbf5a);box-shadow:0 0 10px rgba(255,200,100,.9);}
.clock .t{font-family:var(--serif);font-size:calc(1.15rem * var(--fs));letter-spacing:.05em;}
.clock .d{font-size:.72rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;}
.hud-right{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
.money{padding:.45em .9em;border-radius:999px;background:rgba(10,6,14,.6);border:1px solid rgba(217,181,108,.35);color:var(--gold-2);font-size:calc(.85rem * var(--fs));}

/* ================= PERSONAGEM EM CENA ================= */
#charLayer{position:absolute;left:0;right:0;bottom:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .6s ease;}
#charLayer .portrait{margin-bottom:-2vh;transition:opacity .5s ease,transform .5s ease;}
#charLayer .portrait.leaving{opacity:0;transform:translateY(20px);}
#charLayer .portrait.entering{animation:rise .6s ease both;}
#game.mode-hub #charLayer{transform:translateX(18vw);}

/* ================= HUB ================= */
#hub{position:absolute;left:max(16px,2vw);top:76px;bottom:16px;width:min(420px,calc(100vw - 32px));z-index:15;
  display:flex;flex-direction:column;gap:10px;overflow:auto;padding-bottom:4px;scrollbar-width:thin;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);animation:rise .4s ease both;}
.panel h2{margin:0 0 .2em;font-family:var(--serif);font-weight:400;font-size:calc(1.6rem * var(--fs));letter-spacing:.02em;}
.panel h3{margin:0 0 .6em;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;}
.panel p{margin:.2em 0 .8em;color:var(--muted);line-height:1.5;font-size:calc(.9rem * var(--fs));}
.presence{display:flex;flex-wrap:wrap;gap:6px;margin:.2em 0 .6em;}
.tag{display:inline-flex;align-items:center;gap:.4em;padding:.25em .7em;border-radius:999px;font-size:.78rem;border:1px solid var(--line);background:rgba(255,255,255,.04);}
.tag .dot{width:8px;height:8px;border-radius:50%;}
.actions{display:flex;flex-direction:column;gap:7px;}
.action{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:.75em 1em;border-radius:12px;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);transition:all .2s;font-size:calc(.92rem * var(--fs));}
.action:hover:not(:disabled),.action:focus-visible{border-color:var(--rose);background:rgba(255,79,147,.08);outline:none;}
.action:disabled{opacity:.45;}
.action .meta{font-size:.72rem;color:var(--muted);white-space:nowrap;}
.action .why{display:block;font-size:.74rem;color:var(--muted);margin-top:.2em;}
.action.special{border-color:rgba(217,181,108,.55);background:linear-gradient(90deg,rgba(217,181,108,.14),rgba(255,79,147,.06));}
.action.special .label::before{content:'✦ ';color:var(--gold-2);}
.map{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.map .action{flex-direction:column;align-items:flex-start;gap:2px;padding:.65em .8em;}
.map .action.here{border-color:rgba(68,230,216,.55);background:rgba(68,230,216,.07);}
.map .who{font-size:.72rem;color:var(--muted);}

/* ================= DIÁLOGO ================= */
#dialogue{position:absolute;left:0;right:0;margin:0 auto;bottom:max(14px,env(safe-area-inset-bottom));z-index:25;
  width:min(980px,calc(100vw - 32px));min-height:168px;padding:30px 28px 22px;border-radius:20px;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,rgba(24,12,32,.86),rgba(10,5,15,.94));border:1px solid rgba(255,255,255,.1);
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,79,147,.08),0 0 40px rgba(155,107,255,.12);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:rise .35s ease both;}
#dialogue .name{position:absolute;top:-17px;left:24px;padding:.35em 1.2em;border-radius:999px;font-family:var(--serif);font-size:calc(1.05rem * var(--fs));
  letter-spacing:.06em;background:#120a18;border:1px solid var(--nc,var(--gold));color:var(--nc,var(--gold));box-shadow:0 0 18px color-mix(in srgb,var(--nc,#d9b56c) 45%,transparent);}
#dialogue .name.narr{display:none;}
#dialogue .text{font-size:calc(1.12rem * var(--fs));line-height:1.65;min-height:3.3em;white-space:pre-wrap;}
#dialogue .text.narr{font-style:italic;color:#e4d6e6;font-family:var(--serif);font-size:calc(1.18rem * var(--fs));}
#dialogue .text.thought{color:var(--c-player);font-style:italic;}
#dialogue .next{position:absolute;right:22px;bottom:12px;color:var(--rose);animation:pulse 1.2s infinite;font-size:.9rem;}
#dialogue .dctrl{position:absolute;top:-15px;right:20px;display:flex;gap:6px;}
#dialogue .dctrl .icon-btn{padding:.3em .7em;font-size:.7rem;background:#120a18;}

#choices{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:80px 16px 200px;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.35),rgba(0,0,0,.7));}
#choices .choice{width:min(640px,100%);text-align:left;padding:1em 1.3em;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(90deg,rgba(26,12,34,.95),rgba(16,8,22,.95));font-size:calc(1rem * var(--fs));line-height:1.45;transition:all .2s;
  animation:rise .35s ease both;}
#choices .choice:nth-child(2){animation-delay:.06s} #choices .choice:nth-child(3){animation-delay:.12s} #choices .choice:nth-child(4){animation-delay:.18s}
#choices .choice:hover,#choices .choice:focus-visible{border-color:var(--rose);box-shadow:0 0 24px rgba(255,79,147,.25);transform:translateX(4px);outline:none;}
#choices .choice .k{display:inline-block;width:1.6em;color:var(--gold);font-family:var(--serif);}
#choices .choice .note{display:block;margin-top:.35em;font-size:.78rem;color:#ffb36b;}

#fader{position:absolute;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease;}
#fader.on{opacity:1;}

/* ================= TOASTS ================= */
#toasts{position:fixed;top:64px;right:16px;z-index:90;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;}
.toast{padding:.55em 1em;border-radius:12px;background:rgba(16,8,22,.92);border:1px solid var(--line);font-size:calc(.85rem * var(--fs));
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .3s ease both;max-width:min(360px,80vw);}
.toast.good{border-color:rgba(255,79,147,.6);} .toast.bad{border-color:rgba(120,140,255,.6);} .toast.info{border-color:rgba(217,181,108,.6);}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .4s;}

/* ================= MODAIS ================= */
#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,1,6,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.modal-box{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#1a0e22,#0d0711);border:1px solid rgba(255,255,255,.12);
  border-radius:22px;padding:22px 22px 18px;box-shadow:0 40px 80px rgba(0,0,0,.7);animation:rise .3s ease both;}
.modal-box.narrow{width:min(440px,100%);}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
.modal-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:calc(1.6rem * var(--fs));}
.modal-box p{color:var(--muted);line-height:1.55;}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px;}
.list{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);}
.row .grow{flex:1;min-width:0;}
.row .title{font-weight:600;}
.row .desc{font-size:.82rem;color:var(--muted);margin-top:.15em;line-height:1.4;}
.row .ico{font-size:1.5rem;width:1.8em;text-align:center;flex:none;}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap;}
.seg button{border:0;background:transparent;padding:.45em .85em;font-size:.8rem;color:var(--muted);}
.seg button.on{background:linear-gradient(135deg,rgba(255,79,147,.45),rgba(155,107,255,.4));color:#fff;}
.rel-card{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);}
.rel-card .mini{position:relative;width:110px;height:130px;overflow:hidden;border-radius:12px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.07),transparent 70%);}
.rel-card .mini .portrait{position:absolute;left:50%;top:-2px;margin-left:-60px;--pscale:5px;}
.rel-card h4{margin:0;font-family:var(--serif);font-size:1.3rem;font-weight:400;}
.rel-card .role{font-size:.78rem;color:var(--muted);}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:.5em 0 .2em;}
.bar > i{display:block;height:100%;border-radius:999px;transition:width .6s ease;}
.rel-meta{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);}
.chap-dots{display:flex;gap:4px;margin:.4em 0;}
.chap-dots i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.3);}
.chap-dots i.on{border-color:transparent;}
.rel-card .bio{font-size:.84rem;line-height:1.5;color:#d8c8d8;margin:.4em 0 0;}
.rel-card .likes{font-size:.78rem;color:var(--muted);margin-top:.4em;}
.rel-card .invite{font-size:.8rem;color:var(--gold-2);margin-top:.4em;}
.log-line{padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.5;}
.log-line b{font-family:var(--serif);font-weight:400;}
.input{width:100%;padding:.8em 1em;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:var(--text);font-size:1rem;}
.input:focus{outline:none;border-color:var(--rose);}
.err{color:#ff9a9a;font-size:.82rem;min-height:1.2em;margin-top:.4em;}

/* ================= DIA ================= */
#dayPanel{position:absolute;left:0;right:0;top:76px;bottom:16px;margin:0 auto;width:min(640px,calc(100vw - 32px));overflow:auto;z-index:15;display:flex;flex-direction:column;justify-content:center;}
#dayPanel > .panel{margin:auto 0;}
#dayPanel .panel{background:rgba(30,18,40,.82);}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:.6em 0 1em;}
.summary .cell{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.85rem;}
.summary .cell b{display:block;font-family:var(--serif);font-size:1.25rem;font-weight:400;color:var(--gold-2);}

/* ================= FINAL ================= */
#ending{background:#050307;overflow:auto;}
#ending .end-bg{position:fixed;inset:0;}
#ending .end-inner{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:12vh 20px 10vh;text-align:center;}
#ending .kicker{letter-spacing:.5em;text-transform:uppercase;color:var(--gold);font-size:.75rem;}
#ending h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(2.4rem,8vw,4.6rem);margin:.3em 0 .6em;animation:flicker 8s infinite;}
#ending .end-text p{font-family:var(--serif);font-size:calc(1.15rem * var(--fs));line-height:1.8;color:#eadbe8;text-align:left;animation:rise .8s ease both;}
#ending .end-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:2.4em;}
.ending-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
.ending-card{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);min-height:110px;}
.ending-card.on{border-color:rgba(217,181,108,.55);background:linear-gradient(135deg,rgba(217,181,108,.12),rgba(255,79,147,.06));}
.ending-card h4{margin:0 0 .4em;font-family:var(--serif);font-weight:400;font-size:1.2rem;}
.ending-card p{margin:0;font-size:.82rem;}

/* ================= RESPONSIVO ================= */
@media (max-width:760px){
  :root{--pscale:min(1.45vh,3.6vw);}
  #game.mode-hub #charLayer{transform:translateY(-43vh) scale(.62);transform-origin:50% 100%;}
  #hub{top:auto;left:8px;right:8px;width:auto;bottom:8px;max-height:50vh;}
  #dialogue{padding:26px 18px 18px;min-height:150px;}
  #dialogue .text{font-size:calc(1rem * var(--fs));}
  #dialogue .text.narr{font-size:calc(1.05rem * var(--fs));}
  #choices{padding:70px 12px 180px;}
  .clock .d{display:none;}
  .rel-card{grid-template-columns:1fr;}
  .rel-card .mini{width:100%;}
  .rel-card .mini .portrait{left:50%;}
  #hud{padding-left:10px;padding-right:10px;}
  .icon-btn .lbl{display:none;}
}
@media (max-height:520px) and (orientation:landscape){
  :root{--pscale:2.2vh;}
  #dialogue{min-height:120px;padding:22px 18px 14px;}
  #hub{top:60px;}
}
/* ================= RETRATOS EM CSS ================= */
.portrait{
  --lid:16%; --iris-y:0em; --iris-x:0em; --blush:0;
  --bl-r:-2deg; --br-r:2deg; --bl-y:0em; --br-y:0em;
  position:relative; width:24em; height:36em; flex:none;
  font-size:var(--pscale,14px);
  filter: drop-shadow(0 0 1.4em var(--aura));
}
.portrait > div{position:absolute;}
.portrait.breathe{animation:breathe 5s ease-in-out infinite;}
.p-aura{left:50%;top:6em;width:22em;height:26em;margin-left:-11em;border-radius:50%;
  background:radial-gradient(ellipse at 50% 45%, var(--aura) 0%, transparent 65%);opacity:.55;}

/* Cabelo de trás */
.p-hairback{left:50%;}
.p-hairback i{position:absolute;display:block;}

/* Corpo */
.p-body{left:50%;top:16.7em;width:19.6em;height:18.8em;margin-left:-9.8em;
  border-radius:50% 50% 8% 8% / 32% 32% 0 0;background:var(--cloth);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,#000 72%,transparent 100%);}
.p-body::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.35));}
.p-chest{position:absolute;left:50%;top:-.2em;width:7em;height:6em;margin-left:-3.5em;
  background:linear-gradient(180deg,var(--skin-d) 0%,var(--skin) 35%,var(--skin-l) 100%);}
.p-cloth{position:absolute;inset:0;}
.p-neck{left:50%;top:13.4em;width:3.5em;height:5.6em;margin-left:-1.75em;
  background:linear-gradient(180deg,var(--skin-d) 0%,var(--skin-d) 22%,var(--skin) 55%,var(--skin) 100%);
  border-radius:0 0 1.2em 1.2em;}
.p-front{left:0;top:0;width:100%;height:100%;pointer-events:none;}
.p-front > div{position:absolute;}

/* Cabeça */
.p-headwrap{left:50%;top:3.6em;width:8.4em;height:10.8em;margin-left:-4.2em;}
.p-headwrap > div{position:absolute;}
.p-skin{inset:0;border-radius:50% 50% 46% 46% / 42% 42% 58% 58%;
  background:
    radial-gradient(ellipse at 50% 108%, var(--skin-d) 0%, transparent 38%),
    radial-gradient(ellipse at 50% 38%, var(--skin-l) 0%, var(--skin) 55%, var(--skin-d) 100%);
  box-shadow: inset -.5em -.3em 1em rgba(0,0,0,.18), inset .3em 0 .8em rgba(255,255,255,.05);}
.p-ear{top:4.5em;width:1.15em;height:2.1em;border-radius:50%;
  background:radial-gradient(ellipse at 60% 50%, var(--skin-d), var(--skin) 70%);}
.p-ear.l{left:-.45em;} .p-ear.r{right:-.45em;}
.p-blush{top:6.5em;width:2.3em;height:1.1em;border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,70,110,.55), transparent 70%);opacity:var(--blush);transition:opacity .4s;}
.p-blush.l{left:.7em;} .p-blush.r{right:.7em;}

/* Sobrancelhas */
.p-brow{top:3.85em;width:2em;height:.62em;border-top:.24em solid var(--brow);
  border-radius:50% 50% 0 0 / 100% 100% 0 0;transition:transform .35s ease;}
.p-brow.l{left:1.15em;transform:translateY(var(--bl-y)) rotate(var(--bl-r));}
.p-brow.r{right:1.15em;transform:translateY(var(--br-y)) rotate(var(--br-r));}

/* Olhos */
.p-eye{top:4.75em;width:1.8em;height:.9em;}
.p-eye.l{left:1.25em;} .p-eye.r{right:1.25em;}
.p-ball{position:absolute;inset:0;overflow:hidden;background:#fbf4f1;
  border-top:.17em solid var(--lash);
  border-radius:60% 60% 50% 50% / 90% 90% 45% 45%;
  box-shadow:inset 0 .14em .1em rgba(0,0,0,.18);transition:opacity .25s;}
.p-iris{position:absolute;width:.98em;height:.98em;border-radius:50%;left:50%;
  top:50%;margin:-.56em 0 0 -.49em;
  transform:translate(var(--iris-x),var(--iris-y));transition:transform .35s ease;
  background:radial-gradient(circle at 50% 50%, #0a0508 0 24%, var(--iris) 30%, var(--iris-d) 78%, #120a08 100%);}
.p-iris::after{content:'';position:absolute;width:.24em;height:.24em;border-radius:50%;background:#fff;top:.16em;right:.2em;opacity:.9;}
.p-eye.r .p-iris{background:radial-gradient(circle at 50% 50%, #0a0508 0 24%, var(--iris-r,var(--iris)) 30%, var(--iris-rd,var(--iris-d)) 78%, #120a08 100%);}
.p-lid{position:absolute;left:0;right:0;top:0;height:var(--lid);
  background:linear-gradient(180deg,var(--skin-d),var(--skin));
  border-bottom:.08em solid rgba(40,10,20,.45);transition:height .3s ease;}
.portrait.blink .p-lid{animation:blink 6s infinite;}
.p-eye::after{content:'';position:absolute;top:-.12em;right:-.3em;width:.55em;height:.2em;
  background:var(--lash);border-radius:0 100% 0 100%;transform:rotate(-24deg);}
.p-eye.l::after{right:auto;left:-.3em;transform:scaleX(-1) rotate(-24deg);}
.p-eye::before{content:'';position:absolute;display:none;left:.12em;right:.12em;top:.15em;height:.6em;
  border-top:.2em solid var(--lash);border-radius:50% 50% 0 0 / 100% 100% 0 0;}
.mood-laugh .p-ball{opacity:0;}
.mood-laugh .p-eye::before{display:block;}

/* Nariz */
.p-nose{left:50%;top:5.7em;width:.8em;height:1.7em;margin-left:-.4em;
  background:linear-gradient(90deg, transparent 35%, rgba(70,25,15,.16) 62%, transparent 85%);
  border-radius:0 0 50% 50%;}
.p-nose::after{content:'';position:absolute;left:50%;bottom:-.05em;width:1em;height:.42em;margin-left:-.5em;
  border-radius:50%;box-shadow:inset 0 -.12em .12em rgba(70,25,15,.28);}

/* Boca */
.p-mouth{left:50%;top:8.05em;width:2.2em;height:.62em;margin-left:-1.1em;
  background:linear-gradient(180deg, var(--lip) 0 46%, var(--lip-d) 46% 54%, var(--lip) 54% 100%);
  border-radius:45% 45% 50% 50% / 55% 55% 65% 65%;transition:all .3s ease;}
.p-mouth::before{content:'';position:absolute;left:50%;top:0;width:.5em;height:.18em;margin-left:-.25em;
  border-radius:0 0 50% 50%;background:rgba(0,0,0,.18);}
.p-mouth::after{content:'';position:absolute;left:32%;top:62%;width:.5em;height:.12em;border-radius:50%;background:rgba(255,255,255,.45);}
.mood-smile .p-mouth,.mood-laugh .p-mouth{width:2.5em;margin-left:-1.25em;height:.8em;
  background:#3b0c18;border:.15em solid var(--lip);border-top-width:.11em;
  border-radius:.25em .25em 1.25em 1.25em / .25em .25em .95em .95em;}
.mood-laugh .p-mouth{height:1.05em;width:2.6em;margin-left:-1.3em;}
.mood-smile .p-mouth::before,.mood-laugh .p-mouth::before{left:8%;right:8%;width:auto;margin:0;top:0;height:38%;
  background:#f6efea;border-radius:0 0 .3em .3em;}
.mood-smile .p-mouth::after,.mood-laugh .p-mouth::after{display:none;}
.mood-smirk .p-mouth{transform:rotate(-7deg) translateX(.18em);width:2em;margin-left:-1em;}
.mood-surprised .p-mouth{width:1.05em;height:1.15em;margin-left:-.52em;top:7.95em;background:#3b0c18;
  border:.16em solid var(--lip);border-radius:50%;}
.mood-surprised .p-mouth::before,.mood-surprised .p-mouth::after{display:none;}
.mood-sad .p-mouth{width:1.8em;margin-left:-.9em;height:.48em;top:8.2em;
  border-radius:55% 55% 30% 30% / 90% 90% 25% 25%;}
.mood-shy .p-mouth{width:1.55em;margin-left:-.78em;height:.52em;}
.mood-flirty .p-mouth{width:2.25em;margin-left:-1.12em;height:.7em;transform:rotate(-3deg);
  background:linear-gradient(180deg, var(--lip) 0 42%, #3b0c18 42% 58%, var(--lip) 58% 100%);}

.p-mark,.p-freckles,.p-extra,.p-hairside,.p-hairfront{pointer-events:none;}
.p-mark{display:none;}
.p-freckles{display:none;}

/* Estados de humor */
.mood-smile{ --lid:22%; --blush:.25; --bl-r:-5deg; --br-r:5deg; --bl-y:-.06em; --br-y:-.06em;}
.mood-laugh{ --blush:.5; --bl-y:-.18em; --br-y:-.18em; --bl-r:-7deg; --br-r:7deg;}
.mood-smirk{ --lid:32%; --bl-r:3deg; --br-r:-9deg; --br-y:-.28em; --iris-x:.1em; --blush:.1;}
.mood-shy{ --lid:46%; --iris-y:.2em; --iris-x:-.12em; --blush:.85; --bl-r:-11deg; --br-r:11deg; --bl-y:-.06em; --br-y:-.06em;}
.mood-surprised{ --lid:0%; --bl-y:-.42em; --br-y:-.42em; --bl-r:-3deg; --br-r:3deg;}
.mood-sad{ --lid:38%; --iris-y:.14em; --bl-r:-14deg; --br-r:14deg; --bl-y:-.1em; --br-y:-.1em;}
.mood-flirty{ --lid:48%; --blush:.55; --bl-r:-2deg; --br-r:-8deg; --br-y:-.2em; --iris-x:.1em;}

@keyframes blink{0%,93%,100%{height:var(--lid);}95.5%{height:100%;}}
@keyframes breathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-.18em);}}

<body>
<!-- MENU INICIAL -->
<section id="menu" class="screen active" aria-label="Menu inicial">
  <div class="menu-bg loc loc-rua" id="menuBg"></div>
  <div class="menu-portraits" id="menuPortraits" aria-hidden="true"></div>
  <div class="menu-inner">
    <h1 class="logo">Velvet Nights<small>HOTEL VELVET · DESDE 1927</small></h1>
    <p class="tagline">Sete noites. Três mulheres. Um hotel que nunca dorme — e escolhas que não se desfazem.</p>
    <div class="menu-buttons">
      <button class="btn primary" id="btnNew">Nova história</button>
      <button class="btn" id="btnContinue">Continuar <span class="sub" id="continueSub"></span></button>
      <button class="btn" id="btnLoad">Carregar</button>
      <button class="btn" id="btnEndings">Finais desbloqueados</button>
      <button class="btn" id="btnSettings">Configurações</button>
    </div>
    <p class="menu-note">Obra de ficção para maiores de 18 anos. Todas as personagens são adultas. Contém flerte e intimidade sugerida, sem conteúdo explícito.</p>
  </div>
</section>

<!-- JOGO -->
<section id="game" class="screen" aria-label="Jogo">
  <div id="stage"></div>
  <div id="charLayer"></div>
  <header id="hud">
    <div class="clock" id="clock" title="Noite e hora atuais">
      <div class="orb" id="clockOrb"></div>
      <div><div class="t" id="clockTime">20:00</div><div class="d" id="clockDay">Noite 1</div></div>
    </div>
    <div class="hud-right">
      <span class="money" id="money" title="Dinheiro">100 €</span>
      <button class="icon-btn" id="btnRel" title="Relações">♥ <span class="lbl">Relações</span></button>
      <button class="icon-btn" id="btnInv" title="Inventário">✦ <span class="lbl">Inventário</span></button>
      <button class="icon-btn" id="btnPause" title="Menu (Esc)">☰ <span class="lbl">Menu</span></button>
    </div>
  </header>
  <div id="hub" class="hidden"></div>
  <div id="dayPanel" class="hidden"></div>
  <div id="dialogue" class="hidden" role="button" tabindex="0" aria-live="polite">
    <div class="name" id="dName"></div>
    <div class="dctrl">
      <button class="icon-btn" id="btnLog" title="Histórico">Histórico</button>
      <button class="icon-btn" id="btnAuto" title="Avanço automático">Auto</button>
    </div>
    <div class="text" id="dText"></div>
    <div class="next" id="dNext">▼</div>
  </div>
  <div id="choices" class="hidden" role="group" aria-label="Escolhas"></div>
  <div id="fader"></div>
</section>

<!-- FINAL -->
<section id="ending" class="screen" aria-label="Final">
  <div class="end-bg loc" id="endBg"></div>
  <div class="end-inner">
    <div class="kicker" id="endKicker">Final</div>
    <h1 id="endTitle"></h1>
    <div class="end-text" id="endText"></div>
    <div class="end-actions">
      <button class="btn primary" id="btnEndMenu">Voltar ao menu</button>
      <button class="btn" id="btnEndNew">Nova história</button>
    </div>
  </div>
</section>

<div id="modal" class="hidden" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   VELVET NIGHTS — núcleo: constantes, dados, estado, gravação e motor
   ===================================================================== */

const SAVE_VERSION = 1;
const KEYS = {
  slot: id => 'velvetNights.save.' + id,
  settings: 'velvetNights.settings',
  endings: 'velvetNights.endings'
};
const SLOTS = ['auto', '1', '2', '3'];
const NIGHT_START = 1200;      // 20:00 (minutos desde a meia-noite do dia em que começa o turno)
const NIGHT_END = 1800;        // 06:00 do dia seguinte
const LAST_FREE_NIGHT = 6;     // noites 1–6 são jogáveis; a noite 7 é a Gala
const GALA_NIGHT = 7;
const SALARY = 60;
const COST = { travel: 10, story: 45, small: 20, gift: 10, work: 60, special: 90, blackout: 30, wait: 30 };

/* ---------- utilitários ---------- */

/* ---------- estado ---------- */
let state = null;

function newState(name) {
  return {
    v: SAVE_VERSION, name, day: 1, time: NIGHT_START, nextStart: NIGHT_START, money: 100,
    phase: 'night', loc: 'rececao', introDone: false, nightIntro: 0,
    aff: { victoria: 0, luna: 0, sophie: 0 },
    chap: { victoria: 0, luna: 0, sophie: 0 },
    inv: {}, flags: {}, invites: {},
    talked: {}, gifted: {},
    known: { victoria: {}, luna: {}, sophie: {} },
    lastSmall: {}, tipsTonight: 0, lastNight: null, dayResult: null
  };
}

function isInt(v) { return typeof v === 'number' && Number.isFinite(v) && Math.floor(v) === v; }

/* Valida e normaliza um estado carregado. Devolve null se for irrecuperável. */
function validateState(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.v !== SAVE_VERSION) return null;
  if (typeof raw.name !== 'string' || !raw.name.trim()) return null;
  if (!isInt(raw.day) || raw.day < 1 || raw.day > GALA_NIGHT) return null;
  if (raw.phase !== 'night' && raw.phase !== 'day') return null;
  const s = newState(raw.name.trim().slice(0, 16));
  s.day = raw.day;
  s.phase = raw.phase;
  s.time = isInt(raw.time) ? clamp(raw.time, 1080, NIGHT_END) : NIGHT_START;
  s.nextStart = isInt(raw.nextStart) ? clamp(raw.nextStart, 1080, 1320) : NIGHT_START;
  s.money = isInt(raw.money) ? clamp(raw.money, 0, 99999) : 0;
  s.loc = (typeof raw.loc === 'string' && LOCS[raw.loc]) ? raw.loc : 'rececao';
  s.introDone = !!raw.introDone;
  s.nightIntro = isInt(raw.nightIntro) ? raw.nightIntro : 0;
  s.tipsTonight = isInt(raw.tipsTonight) ? Math.max(0, raw.tipsTonight) : 0;
  for (const c of CHAR_IDS) {
    s.aff[c] = raw.aff && isInt(raw.aff[c]) ? clamp(raw.aff[c], 0, 100) : 0;
    s.chap[c] = raw.chap && isInt(raw.chap[c]) ? clamp(raw.chap[c], 0, 5) : 0;
    if (raw.talked && isInt(raw.talked[c])) s.talked[c] = raw.talked[c];
    if (raw.gifted && isInt(raw.gifted[c])) s.gifted[c] = raw.gifted[c];
    if (raw.lastSmall && isInt(raw.lastSmall[c])) s.lastSmall[c] = raw.lastSmall[c];
    if (raw.known && raw.known[c] && typeof raw.known[c] === 'object') {
      for (const it of ITEM_IDS) {
        const r = raw.known[c][it];
        if (r === 'love' || r === 'like' || r === 'neutral' || r === 'hate') s.known[c][it] = r;
      }
    }
    const inv = raw.invites && raw.invites[c];
    if (inv && typeof inv === 'object' && (inv.n === 3 || inv.n === 5) && isInt(inv.day) && isInt(inv.from) && isInt(inv.to)
        && LOCS[inv.loc] && s.chap[c] === inv.n - 1) {
      s.invites[c] = { n: inv.n, loc: inv.loc, day: inv.day, from: inv.from, to: inv.to };
    }
  }
  if (raw.inv && typeof raw.inv === 'object') {
    for (const it of ITEM_IDS) if (isInt(raw.inv[it]) && raw.inv[it] > 0) s.inv[it] = Math.min(raw.inv[it], 9);
  }
  if (raw.flags && typeof raw.flags === 'object') {
    for (const k of Object.keys(raw.flags)) if (/^[a-z0-9_]{1,40}$/.test(k) && raw.flags[k] === true) s.flags[k] = true;
  }
  if (raw.lastNight && typeof raw.lastNight === 'object' && isInt(raw.lastNight.day)) {
    s.lastNight = { day: raw.lastNight.day, salary: isInt(raw.lastNight.salary) ? raw.lastNight.salary : SALARY, tips: isInt(raw.lastNight.tips) ? raw.lastNight.tips : 0 };
  }
  // coerência: noite 7 é sempre a Gala; não pode estar em fase "dia"
  if (s.day === GALA_NIGHT) s.phase = 'night';
  return s;
}

const DEFAULT_SETTINGS = { textSpeed: 'normal', autoSpeed: 'normal', bigText: false, reduceMotion: false, showAff: true };
let settings = Object.assign({}, DEFAULT_SETTINGS);
function loadSettings() {
  try {
    const raw = JSON.parse(Store.get(KEYS.settings) || '{}');
    if (['slow', 'normal', 'fast', 'instant'].includes(raw.textSpeed)) settings.textSpeed = raw.textSpeed;
    if (['slow', 'normal', 'fast'].includes(raw.autoSpeed)) settings.autoSpeed = raw.autoSpeed;
    settings.bigText = raw.bigText === true;
    settings.reduceMotion = raw.reduceMotion === true;
    settings.showAff = raw.showAff !== false;
  } catch (e) { settings = Object.assign({}, DEFAULT_SETTINGS); }
}
function saveSettings() { Store.set(KEYS.settings, JSON.stringify(settings)); }

/* ---------- gravações ---------- */
function readSlot(id) {
  const raw = Store.get(KEYS.slot(id));
  if (raw == null) return { empty: true };
  try {
    const data = JSON.parse(raw);
    const st = validateState(data && data.state);
    if (!st) return { corrupt: true };
    return { state: st, savedAt: typeof data.savedAt === 'number' ? data.savedAt : 0 };
  } catch (e) { return { corrupt: true }; }
}
function writeSlot(id) {
  if (!state) return false;
  return Store.set(KEYS.slot(id), JSON.stringify({ savedAt: Date.now(), state }));
}
function slotLabel(st) {
  if (st.phase === 'day') return `Dia ${st.day} · depois do turno`;
  if (st.day === GALA_NIGHT) return `Noite 7 · Gala de Veludo`;
  return `Noite ${st.day} · ${fmtTime(st.time)} · ${LOCS[st.loc].name}`;
}
function latestSave() {
  let best = null;
  for (const id of SLOTS) {
    const r = readSlot(id);
    if (r.state && (!best || r.savedAt > best.savedAt)) best = { id, ...r };
  }
  return best;
}
function getEndings() {
  try {
    const arr = JSON.parse(Store.get(KEYS.endings) || '[]');
    return Array.isArray(arr) ? arr.filter(x => typeof x === 'string') : [];
  } catch (e) { return []; }
}
function unlockEnding(id) {
  const arr = getEndings();
  if (!arr.includes(id)) { arr.push(id); Store.set(KEYS.endings, JSON.stringify(arr)); }
}

/* ---------- horários das personagens ---------- */
function inviteActive(s, c, t = s.time) {
  const inv = s.invites[c];
  return !!(inv && inv.day === s.day && t >= inv.from && t < inv.to);
}
function charLoc(s, c, t = s.time) {
  if (inviteActive(s, c, t)) return s.invites[c].loc;
  if (c === 'sophie') {
    if (t >= 1080 && t < 1440) return 'rececao';
    if (t >= 1440 && t < 1560) return s.chap.sophie >= 3 ? 'escarlate' : 'funcionarios';
    return null;
  }
  if (c === 'victoria') return (t >= 1260 && t < 1560) ? 'bar' : null;
  if (c === 'luna') return (t >= 1380 && t < 1740) ? 'terraco' : null;
  return null;
}
function charsAt(s, loc) { return CHAR_IDS.filter(c => charLoc(s, c) === loc); }

function locUnlocked(s, id) {
  if (!LOCS[id].secret) return true;
  return !!s.flags['loc_' + id];
}
/* Pode o jogador entrar neste local agora? */
function canEnter(s, id) {
  if (!locUnlocked(s, id)) return { ok: false, why: 'Ainda não conheces este lugar.' };
  if (id === 'boutique' && (s.time < SHOP_OPEN[0] || s.time >= SHOP_OPEN[1])) return { ok: false, why: 'Fechada (abre às 18:00, fecha às 03:00).' };
  const invHere = CHAR_IDS.map(c => s.invites[c]).filter(inv => inv && inv.loc === id && inv.day === s.day);
  if (id === 'escarlate') {
    if (invHere.some(inv => s.time >= inv.from && s.time < inv.to)) return { ok: true };
    if (s.chap.sophie >= 3 && s.time >= 1440 && s.time < 1620) return { ok: true };
    return { ok: false, why: s.chap.sophie >= 3 ? 'Só abre entre as 00:00 e as 03:00.' : 'A porta verde está trancada.' };
  }
  if (id === 'suite' || id === 'estudio' || id === 'jardim') {
    const inv = invHere[0];
    if (inv && s.time >= inv.from && s.time < inv.to) return { ok: true };
    if (inv && s.time < inv.from) return { ok: false, why: `Encontro marcado para as ${fmtTime(inv.from)}.` };
    return { ok: false, why: 'Só com convite.' };
  }
  return { ok: true };
}

/* ---------- capítulos ---------- */
function nextChapter(s, c) {
  const n = s.chap[c] + 1;
  if (n > 5) return null;
  if (s.invites[c]) return null;
  const d = CHAPTERS[c][n];
  if (s.day < d.day || s.aff[c] < d.aff) return null;
  if (n === 5 && s.flags[c + '_declined']) return null;
  if (c === 'luna' && s.flags.luna_closed) return null;
  if (c === 'luna' && n >= 4 && s.flags.luna_betrayed && !s.flags.luna_forgiven) return null;
  return { n, ...d };
}
function makeInvite(s, c, n) {
  const d = CHAPTERS[c][n];
  s.invites[c] = { n, loc: d.invite.loc, day: s.day, from: d.invite.from, to: d.invite.to };
  if (LOCS[d.invite.loc].secret && !s.flags['loc_' + d.invite.loc]) {
    s.flags['loc_' + d.invite.loc] = true;
    UI.toast('Novo local desbloqueado: ' + LOCS[d.invite.loc].name, 'info');
  }
}
function promisedChars(s) { return CHAR_IDS.filter(c => s.flags['promise_' + c]); }
function promiseNote(c) {
  return s => {
    const others = promisedChars(s).filter(x => x !== c);
    return others.length ? '⚠ Já prometeste o teu coração a ' + others.map(x => CHARS[x].name).join(' e ') + '.' : '';
  };
}

/* =====================================================================
   MOTOR DE CENAS
   Nós: {who,m,t} fala · {bg} · {show,m} · {hide} · {fx} · {if,then,else}
        {choice:[...]} · {fade} · {stop} · função(s) → nós dinâmicos
   ===================================================================== */
const Engine = {
  frames: [], onEnd: null, running: false,
  start(nodes, onEnd) {
    this.frames = [{ nodes, i: 0 }];
    this.onEnd = onEnd || null;
    this.running = true;
    UI.enterDialogue();
    this.step();
  },
  step() {
    while (this.running) {
      const f = this.frames[this.frames.length - 1];
      if (!f) { this.finish(); return; }
      if (f.i >= f.nodes.length) { this.frames.pop(); continue; }
      const n = f.nodes[f.i++];
      if (n == null) continue;
      if (typeof n === 'function') {
        const r = n(state);
        if (Array.isArray(r) && r.length) this.frames.push({ nodes: r, i: 0 });
        continue;
      }
      if (n.stop) { this.frames = []; continue; }
      if (n.bg) { UI.setBg(n.bg); continue; }
      if (n.hide) { UI.hideChar(); continue; }
      if (n.show) { UI.showChar(n.show, n.m || 'neutral'); continue; }
      if (n.fx) { n.fx(state); UI.refreshHud(); continue; }
      if (n.if) {
        const branch = n.if(state) ? n.then : n.else;
        if (branch && branch.length) this.frames.push({ nodes: branch, i: 0 });
        continue;
      }
      if (n.fade) { UI.fadeThrough(() => this.step()); return; }
      if (n.choice) {
        const opts = n.choice.filter(o => !o.show || o.show(state));
        if (!opts.length) continue;
        UI.showChoices(opts, o => this.choose(o));
        return;
      }
      if (n.t != null) { UI.showLine(n, () => this.step()); return; }
    }
  },
  choose(o) {
    if (o.aff) for (const c of Object.keys(o.aff)) addAff(c, o.aff[c]);
    if (o.set) for (const f of o.set) state.flags[f] = true;
    if (o.money) addMoney(o.money);
    if (o.fx) o.fx(state);
    UI.refreshHud();
    UI.log(null, '» ' + fill(o.t));
    if (o.next && o.next.length) this.frames.push({ nodes: o.next, i: 0 });
    this.step();
  },
  finish() {
    this.running = false;
    this.frames = [];
    UI.leaveDialogue();
    const cb = this.onEnd; this.onEnd = null;
    if (cb) cb();
  },
  abort() { this.running = false; this.frames = []; this.onEnd = null; }
};

function fill(t) { return String(t).replace(/\{nome\}/g, state ? state.name : ''); }

function addAff(c, n) {
  if (!state || !CHARS[c] || !n) return;
  const before = state.aff[c];
  state.aff[c] = clamp(before + n, 0, 100);
  const d = state.aff[c] - before;
  if (d !== 0 && settings.showAff) UI.toast(`${d > 0 ? '♥' : '♡'} ${CHARS[c].name} ${d > 0 ? '+' : ''}${d}`, d > 0 ? 'good' : 'bad');
}
function addMoney(n) {
  if (!state || !n) return;
  state.money = Math.max(0, state.money + n);
  UI.toast(`${n > 0 ? '+' : ''}${n} €`, 'info');
}
function addItem(id, n = 1) {
  if (!ITEMS[id]) return false;
  const cur = state.inv[id] || 0;
  if (cur + n > 9) return false;
  state.inv[id] = cur + n;
  return true;
}

function giftScene(c, item) {
  const r = (PREFS[c] && PREFS[c][item]) || 'neutral';
  let pool = GIFT_LINES[c][r];
  if (!Array.isArray(pool)) pool = pool[item] || [['neutral', 'Obrigada.']];
  const [mood, line] = pick(pool);
  const itemName = ITEMS[item].name;
  return {
    reaction: r,
    nodes: [
      N(`Entregas-lhe o presente: ${ITEMS[item].icon} ${itemName}.`),
      SAY[c](mood, line.replace('{item}', itemName))
    ]
  };
}

        N('A música continua. Os convidados dançam. Ninguém te procura no meio da multidão — e talvez a culpa seja tua.'),
        FX(st => { st.ending = 'solitario'; })
      ];
    }
  ];
}

/* céu: interpolação de cor ao longo da noite */
const SKY_KEYS = [
  [1080, '#2b1a4a', '#ff8a5c', 0], [1170, '#1e1440', '#b8507a', .25], [1260, '#120c2c', '#4a1d5e', .6],
  [1440, '#07061a', '#1d0e33', 1], [1620, '#060518', '#1a0d30', 1], [1710, '#141236', '#4a2a5e', .6],
  [1770, '#2a2a5a', '#d98a8a', .2], [1800, '#3d4a7a', '#ffb48a', 0]
];
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hex2rgb(a), B = hex2rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }
function skyAt(t) {
  if (t <= SKY_KEYS[0][0]) return SKY_KEYS[0];
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1];
    if (t >= a[0] && t <= b[0]) { const k = (t - a[0]) / (b[0] - a[0]); return [t, mix(a[1], b[1], k), mix(a[2], b[2], k), a[3] + (b[3] - a[3]) * k]; }
  }
  return SKY_KEYS[SKY_KEYS.length - 1];
}

const UI = {
  bgId: null, charId: null, auto: false, typing: null, pending: null, autoTimer: null, logLines: [], modalStack: 0,

  screen(id) {
    for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === id);
  },
  applySettings() {
    document.body.classList.toggle('large-text', settings.bigText);
    document.body.classList.toggle('reduce-motion', settings.reduceMotion);
  },

  /* ---------- cenário ---------- */
  setBg(id) {
    const stage = $('#stage');
    if (this.bgId === id && stage.firstChild) return;
    this.bgId = id;
    const old = Array.from(stage.children);
    const nb = makeBg(id);
    nb.style.opacity = '0';
    stage.appendChild(nb);
    requestAnimationFrame(() => requestAnimationFrame(() => { nb.style.opacity = '1'; }));
    setTimeout(() => old.forEach(o => o.remove()), settings.reduceMotion ? 0 : 850);
  },
  updateSky() {
    const root = document.documentElement.style;
    if (!state) return;
    if (state.phase === 'day') {
      root.setProperty('--sky1', '#f7c59f'); root.setProperty('--sky2', '#a98bc2'); root.setProperty('--stars', '0');
      return;
    }
    const [, a, b, st] = skyAt(state.time);
    root.setProperty('--sky1', a); root.setProperty('--sky2', b); root.setProperty('--stars', String(st));
  },

  /* ---------- personagens ---------- */
  showChar(c, mood) {
    const layer = $('#charLayer');
    const cur = layer.querySelector('.portrait:not(.leaving)');
    if (cur && cur.dataset.char === c) {
      MOODS.forEach(m => cur.classList.remove('mood-' + m));
      cur.classList.add('mood-' + (MOODS.includes(mood) ? mood : 'neutral'));
      return;
    }
    this.hideChar();
    const p = makePortrait(c, mood, true);
    p.classList.add('entering');
    layer.appendChild(p);
    this.charId = c;
  },
  hideChar() {
    const layer = $('#charLayer');
    for (const p of layer.querySelectorAll('.portrait:not(.leaving)')) {
      p.classList.add('leaving');
      setTimeout(() => p.remove(), settings.reduceMotion ? 0 : 500);
    }
    this.charId = null;
  },
  setUnmasked(on) {
    const p = $('#charLayer .portrait.char-sophie:not(.leaving)');
    if (p) p.classList.toggle('unmasked', on);
    this.sophieUnmasked = on;
  },

  /* ---------- HUD ---------- */
  refreshHud() {
    if (!state) return;
    const day = state.phase === 'day';
    $('#clockTime').textContent = day ? 'Manhã' : fmtTime(state.time);
    $('#clockDay').textContent = day ? 'Dia ' + state.day : (state.day === GALA_NIGHT ? 'Noite 7 · Gala' : 'Noite ' + state.day + ' de 7');
    $('#clockOrb').classList.toggle('sun', day);
    $('#money').textContent = state.money + ' €';
    this.updateSky();
  },

  /* ---------- diálogo ---------- */
  enterDialogue() {
    $('#game').classList.remove('mode-hub');
    $('#hub').classList.add('hidden');
    $('#dayPanel').classList.add('hidden');
  },
  leaveDialogue() {
    this.stopAuto();
    $('#dialogue').classList.add('hidden');
    $('#choices').classList.add('hidden');
    this.pending = null;
  },
  showLine(node, cb) {
    const box = $('#dialogue');
    box.classList.remove('hidden');
    $('#choices').classList.add('hidden');
    const nameEl = $('#dName'), textEl = $('#dText');
    let name = '', color = '';
    textEl.className = 'text';
    if (node.who && CHARS[node.who]) {
      name = CHARS[node.who].name; color = CHARS[node.who].color;
      this.showChar(node.who, node.m || 'neutral');
      if (node.who === 'sophie' && this.sophieUnmasked) this.setUnmasked(true);
    } else if (node.who === 'marcel') { name = MARCEL.name; color = MARCEL.color; }
    else if (node.who === 'player') {
      name = state.name; color = 'var(--c-player)';
      if (/^\(/.test(node.t)) textEl.classList.add('thought');
    } else textEl.classList.add('narr');
    nameEl.textContent = name;
    nameEl.className = 'name' + (name ? '' : ' narr');
    nameEl.style.setProperty('--nc', color || 'var(--gold)');
    const text = fill(node.t);
    this.log(name || null, text);
    this.pending = cb;
    $('#dNext').style.visibility = 'hidden';
    this.typeText(textEl, text);
  },
  typeText(target, text) {
    if (this.typing) clearInterval(this.typing.timer);
    const SPEEDS = { slow: 42, normal: 22, fast: 9, instant: 0 };
    const speed = settings.textSpeed in SPEEDS ? SPEEDS[settings.textSpeed] : 22;
    if (!speed) { target.textContent = text; this.typing = null; this.lineDone(); return; }
    target.textContent = '';
    const t = { full: text, i: 0, timer: null };
    t.timer = setInterval(() => {
      t.i += 1;
      target.textContent = text.slice(0, t.i);
      if (t.i >= text.length) { clearInterval(t.timer); this.typing = null; this.lineDone(); }
    }, speed);
    this.typing = t;
  },
  lineDone() {
    $('#dNext').style.visibility = 'visible';
    if (this.auto) {
      const base = { slow: 2600, normal: 1700, fast: 950 }[settings.autoSpeed] || 1700;
      const len = $('#dText').textContent.length;
      clearTimeout(this.autoTimer);
      this.autoTimer = setTimeout(() => this.advance(), base + len * 18);
    }
  },
  advance() {
    if ($('#dialogue').classList.contains('hidden')) return;
    if (!$('#modal').classList.contains('hidden')) return;
    if (this.typing) {
      clearInterval(this.typing.timer);
      $('#dText').textContent = this.typing.full;
      this.typing = null;
      this.lineDone();
      return;
    }
    clearTimeout(this.autoTimer);
    const cb = this.pending; this.pending = null;
    if (cb) cb();
  },
  toggleAuto() {
    this.auto = !this.auto;
    $('#btnAuto').classList.toggle('on', this.auto);
    if (this.auto && !this.typing && this.pending) this.lineDone();
    if (!this.auto) clearTimeout(this.autoTimer);
  },
  stopAuto() { clearTimeout(this.autoTimer); },
  showChoices(opts, cb) {
    clearTimeout(this.autoTimer);
    const box = $('#choices');
    box.innerHTML = '';
    box.classList.remove('hidden');
    $('#dNext').style.visibility = 'hidden';
    opts.forEach((o, i) => {
      const b = el('button', 'choice');
      const k = el('span', 'k', (i + 1) + '.');
      b.appendChild(k);
      b.appendChild(document.createTextNode(fill(o.t)));
      const note = typeof o.note === 'function' ? o.note(state) : o.note;
      if (note) b.appendChild(el('span', 'note', note));
      b.addEventListener('click', () => {
        if (box.classList.contains('hidden')) return;
        box.classList.add('hidden');
        box.innerHTML = '';
        cb(o);
      });
      box.appendChild(b);
    });
    const first = box.querySelector('button');
    if (first) setTimeout(() => first.focus({ preventScroll: true }), 50);
  },
  fadeThrough(cb) {
    const f = $('#fader');
    $('#dialogue').classList.add('hidden');
    if (settings.reduceMotion) { this.hideChar(); cb(); return; }
    f.classList.add('on');
    setTimeout(() => { this.hideChar(); setTimeout(() => { f.classList.remove('on'); setTimeout(cb, 500); }, 900); }, 950);
  },
  log(who, text) {
    this.logLines.push({ who, text });
    if (this.logLines.length > 150) this.logLines.shift();
  },

  /* ---------- toasts ---------- */
  toast(msg, type = 'info') {
    const t = el('div', 'toast ' + type, msg);
    $('#toasts').appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 450); }, 2600);
  },

  /* ---------- modais ---------- */
  openModal(build, narrow) {
    const m = $('#modal');
    m.innerHTML = '';
    const box = el('div', 'modal-box' + (narrow ? ' narrow' : ''));
    m.appendChild(box);
    build(box);
    m.classList.remove('hidden');
    clearTimeout(this.autoTimer);
    const f = box.querySelector('input,button.btn.primary,button');
    if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  },
  closeModal() {
    const m = $('#modal');
    m.classList.add('hidden');
    m.innerHTML = '';
    if (this.auto && this.pending && !this.typing) this.lineDone();
  },
  modalHead(box, title) {
    const h = el('div', 'modal-head');
    h.appendChild(el('h2', null, title));
    const x = el('button', 'icon-btn', 'Fechar ✕');
    x.addEventListener('click', () => this.closeModal());
    h.appendChild(x);
    box.appendChild(h);
  },
  confirm(title, text, okLabel, onOk, danger) {
    this.openModal(box => {
      box.appendChild(el('h2', null, title)).style.cssText = 'font-family:var(--serif);font-weight:400;margin:0 0 .4em';
      box.appendChild(el('p', null, text));
      const f = el('div', 'modal-foot');
      const no = el('button', 'btn', 'Cancelar');
      no.addEventListener('click', () => this.closeModal());
      const ok = el('button', 'btn ' + (danger ? 'danger' : 'primary'), okLabel);
      ok.addEventListener('click', () => { this.closeModal(); onOk(); });
      f.append(no, ok);
      box.appendChild(f);
    }, true);
  }
};
